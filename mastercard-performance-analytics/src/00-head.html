  ============================================================================
  LEIA-ME · COMO TROCAR OS DADOS DESTE VÍDEO
  ============================================================================
  Este arquivo é o vídeo (1920 × 1080, funciona offline). Todos os números e textos
  das telas de dados vêm do bloco JSON logo abaixo (<script id="pa-data">).
  O resto do arquivo (estilos e código) não precisa ser mexido.

  ARQUIVOS (todos NA MESMA PASTA)
    • este HTML ................. o vídeo: guia, dados, estilos e código (sem base64)
    • sources.js ................ as músicas (MP3 em base64) e as grades de batida;
                                  não precisa ser aberto nem editado. Sem ele, o vídeo
                                  roda em silêncio e mostra um aviso no topo.
    • dashboard-fraude.png ...... o print do dashboard (veja o passo 5)

  PASSO A PASSO
    1. Abra este arquivo num editor de texto (VS Code, Notepad++, Sublime…).
    2. Troque o conteúdo entre  <script type="application/json" id="pa-data">  e
       </script>  pelo JSON com os dados reais, mantendo os mesmos nomes de chave.
    3. Salve e abra no Chrome ou no Edge. Se aparecer "—" numa tela, a chave daquele
       dado não foi encontrada: confira o nome.
    4. Na versão real, apague o campo presentation_context.disclaimer (é ele que mostra
       o aviso "versão mockada" no canto de todas as telas).
    5. A imagem do dashboard (case de relatórios) é o arquivo dashboard-fraude.png NA
       MESMA PASTA deste HTML: troque pelo print real com o mesmo nome (ou escreva outro
       nome no campo dashboard_image do case). Sem o arquivo, o vídeo desenha um
       dashboard ilustrativo.

  REGRAS DO JSON
    • aspas duplas e nenhuma vírgula depois do último item (valide no VS Code ou em
      jsonlint.com antes de salvar: um JSON inválido deixa as telas sem dados);
    • valores em milhões de US$ são números: 2.5 = US$ 2,5 mi;
    • percentuais podem vir como texto: "21%";
    • o ano vem do nome da chave: business_scale_2026 → "em 2026";
    • versão para circular (mascarada): troque os nomes de clientes, tracks, tipos de projeto
      e PILARES da prática por frutas e verduras (ex.: pilares Alface, Rúcula, Chuchu…).

  ONDE CADA CAMPO APARECE
    presentation_context.organization ............. pré-show e letreiro final
    presentation_context.disclaimer ............... aviso "versão mockada" (apague na versão real)
    Seção 2 · estação 02 (evolução e impacto)
      revenue_performance_analytics_usd_millions .... tela 1: receita por ano ("2026_forecast" = previsão)
      business_scale_AAAA.projects_delivered ........ tela 2: número de projetos
        (projects_delivered_display curto, como "+30", substitui o número na tela)
      business_scale_AAAA.highlight_project_type .... tela 2: a frente em destaque (opcional; sem ele, a de
        maior receita). Valor = revenue_share da frente × business_scale_AAAA.revenue_usd_millions_approx
      revenue_contribution_by_project_type_AAAA ..... tela 2: receita por tipo de projeto
        (project_type, revenue_share e delivery_model: "Track" = só a track; "Track + Outra" = com outra track)
      revenue_contribution_summary_AAAA ............. tela 2: receita só da track × com outras tracks
      project_mix_AAAA.projects_with_other_tracks_approx .. tela 2: % de projetos com outras tracks
      team_structure_AAAA ........................... tela 3: pessoas por nível
        (levels: level, current_internal_positions; e o total current_internal_positions.
         Só as posições internas aparecem: os contractors ficam fora da tela)
    Seção 3 (client_types, capabilities) ............ estação 03
    Seção 4 · cases, NESTA ORDEM .................... estação 04
      1º cestas de produtos · 2º principalidade · 3º relatórios automatizados · 4º agentes de IA
      (o vídeo acha cada case pelo começo do nome: "Cliente Banana", "Cliente Manga", "Lights-off",
       "Insight Agent"; se o nome for outro, vale a posição na lista)
    Seção 5 (innovation_examples) ................... estação 05
    Seção 6 (pillars: pillar, contribution ou highlights) .. estação 06
    headline_numbers_for_slides ..................... números de apoio ("display" fixa o texto exato)
  ============================================================================
-->

  PERFORMANCE ANALYTICS — "A LINHA"

<style>
  :root {
    --red: #EB001B; --orange: #FF5F00; --yellow: #F79E1B;
    --ink: #141414; --cream: #F5F1EA; --stone: #8A8378;
    --ui-bg: rgba(20, 20, 20, 0.72); --ui-fg: #F5F1EA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--ui-fg); user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; flex: none; width: 1920px; height: 1080px; transform-origin: center center;
    background: #000; overflow: hidden; box-shadow: 0 0 120px rgba(0,0,0,.6);
  }
  #stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

  /* ---------- Overlay inicial ---------- */
  #intro {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 36px; background: radial-gradient(ellipse at center, rgba(20,20,20,.55), rgba(0,0,0,.92));
    cursor: pointer; transition: opacity .6s ease; z-index: 5;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro .logo { position: relative; width: 210px; height: 130px; }
  #intro .logo span { position: absolute; top: 0; width: 130px; height: 130px; border-radius: 50%; }
  #intro .logo .a { left: 0; background: var(--red); }
  #intro .logo .b { right: 0; background: var(--yellow); }
  #intro .logo .c { left: 80px; width: 50px; background: var(--orange); border-radius: 0;
    clip-path: path('M25 13.8 A65 65 0 0 1 25 116.2 A65 65 0 0 1 25 13.8 Z'); }
  #intro h1 { font-size: 92px; font-weight: 800; letter-spacing: -2px; color: #fff; }
  #intro p { font-size: 30px; font-weight: 300; color: #d9d3ca; letter-spacing: 1px; }
  #intro .play {
    margin-top: 12px; display: flex; align-items: center; gap: 22px; padding: 26px 54px 26px 42px;
    border-radius: 999px; background: var(--orange); color: #fff; font-size: 34px; font-weight: 700;
    box-shadow: 0 20px 60px rgba(255,95,0,.35); transition: transform .2s ease;
  }
  #intro:hover .play { transform: scale(1.04); }
  #intro .play i { width: 0; height: 0; border-left: 30px solid #fff; border-top: 19px solid transparent; border-bottom: 19px solid transparent; }
  #intro small { font-size: 20px; color: #8a8378; }

  /* ---------- Controles ---------- */
  #ui {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(1100px, calc(100vw - 32px));
    display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 16px;
    background: var(--ui-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .4s ease, transform .4s ease; z-index: 10; font-size: 14px;
  }
  #ui.idle { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }
  #ui button {
    flex: none; height: 36px; min-width: 36px; padding: 0 10px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.08); color: var(--ui-fg); font: inherit; font-weight: 600; cursor: pointer;
  }
  #ui button:hover { background: rgba(255,255,255,.18); }
  #ui button.off { opacity: .45; text-decoration: line-through; }
  #ui button.primary { background: var(--orange); color: #fff; min-width: 44px; }
  #time { flex: none; font-variant-numeric: tabular-nums; color: #d9d3ca; min-width: 92px; text-align: center; }
  #bar { position: relative; flex: 1; height: 28px; cursor: pointer; }
  #bar .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); }
  #bar .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow)); }
  #bar .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,95,0,.35); }
  #bar .tick { position: absolute; top: 9px; width: 2px; height: 10px; margin-left: -1px; background: rgba(255,255,255,.35); border-radius: 1px; }
  #bar .tip { position: absolute; bottom: 30px; transform: translateX(-50%); padding: 4px 8px; border-radius: 6px; background: #000; color: #fff; white-space: nowrap; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #bar:hover .tip { opacity: 1; }
  #bar .stop { position: absolute; top: 8px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: #FF5F00; border: 2px solid #fff; border-radius: 2px; }
  #voiceinfo { flex: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8a8378; font-size: 12px; }
  @media (max-width: 720px) { #voiceinfo { display: none; } #ui { gap: 8px; padding: 8px 10px; } }
</style>
