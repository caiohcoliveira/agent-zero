const FMT = {
  num(v, d = 2) { return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d }); },

  mult(v, d = 2) { return FMT.num(v, d) + '×'; },
  /** '+0.25 de variação relativa' (ou 0.25) → '+25%' */
  rel(v, d = 1) {
    const x = typeof v === 'number' ? v : parseFloat(String(v));
    return isFinite(x) ? (x >= 0 ? '+' : '−') + FMT.num(Math.abs(x) * 100, d) + '%' : '—';
  },
  /** '0.25MM' → '250 mil' · '2.5MM' → '2,5 mi' */
  mm(v) {
    const x = parseFloat(String(v)) * 1e6;
    if (!isFinite(x)) return '—';
    return x >= 1e6 ? FMT.num(x / 1e6, 1) + ' mi' : x >= 1e3 ? FMT.num(x / 1e3, 0) + ' mil' : FMT.num(x, 0);
  },
  /** valor em milhões de US$ → 'US$ 2,5 mil' · 'US$ 1,5 mi' */
  usdMM(v) {
    const x = Number(v) * 1e6;
    if (!isFinite(x)) return '—';
    return 'US$ ' + (x >= 1e6 ? FMT.num(x / 1e6, 1) + ' mi' : x >= 1e3 ? FMT.num(x / 1e3, 1) + ' mil' : FMT.num(x, 0));
  },
  /** número-manchete em texto livre → versão pt-BR; o que não reconhece só troca ponto decimal por vírgula */
  auto(s) {

    if ((m = s.match(/^\$\s?(\d+(?:\.\d+)?)\s*->\s*\$\s?(\d+(?:\.\d+)?)$/))) return `US$ ${FMT.num(+m[1], 0)} → US$ ${FMT.num(+m[2], 0)}`;

/* ============================================================================
   5. AUDIO — trilha + SFX 100% sintetizados (Web Audio API)
   ----------------------------------------------------------------------------
   • A trilha é uma função do tempo do vídeo: um scheduler com lookahead

   • Seções (MUSIC) definem quais instrumentos tocam e o filtro do mix.
   • SFX são cues da timeline: cue('cena', tLocal, 'tipo', {opções}).
   ========================================================================== */
const CUES = [];
function cue(sceneId, at, type, opt = {}) {
  const t = CONFIG.sceneById[sceneId].start + at;
  CUES.push({ t, type, opt });
  if (type === 'impact') IMPACTS.push({ t, size: opt.size == null ? 1 : opt.size });
}

// se a faixa não estiver no HTML, entra um groove de reserva.
// Flags: kick hat hat16 clap bass arp pad pluck comic roll big soft minor arpOct rise (filtro sobe até o fim da seção)
const FULL = { kick: 1, hat: 1, clap: 1, bass: 1, arp: 1, pad: 1 };
const MUSIC_SPEC = {
  // embarque (20 s): identidade → as portas abrem no tempo cheio (6 s) → o mapa ganha brilho (13 s) → respiro para a Conversa 0
  open: [[0, { pad: 1, f: 700 }], [2, { pad: 1, kick: 1, soft: 1, f: 1200, rise: 1 }], [6, { ...FULL, f: 14000 }], [13, { ...FULL, arpOct: 1, f: 14000 }], [18, { pad: 1, f: 1400 }]]

const MUSIC = (() => {
  const out = [], hasTrack = sc => { const p = CONFIG.playById[sc.play]; return !!(p && p.track && MUSIC_SRC(p.track)); };
  // v7.17: o play com a música das conversas (a abertura) fica sem a trilha sintetizada, se a faixa estiver no HTML
  const pauseMusic = sc => { const p = CONFIG.playById[sc.play], c = CONFIG.audio.pause; return !!(p && p.pause && c && MUSIC_SRC(c.track)); };
  CONFIG.scenes.forEach(sc => { const spec = (pauseMusic(sc) ? SILENT_SPEC : null) || MUSIC_SPEC[sc.id] || (hasTrack(sc) ? SILENT_SPEC : FALLBACK_SPEC);
    spec.forEach(([at, f], i) => out.push([sc.start + at, sc.start + (i + 1 < spec.length ? spec[i + 1][0] : sc.dur), f])); });

  pluck(at, f, v, d) { const g = this.gain(this.filter, 0); this.env(g, at, .003, v, d); const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(4200, at); lp.frequency.exponentialRampToValueAtTime(700, at + d); lp.connect(g); g.connect(this.send); this.osc('square', f, at, d, lp); this.osc('triangle', f * 2, at, d, g); },
  pad(at, f, dur, v) { const g = this.gain(this.filter, 0); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(v, at + .5); g.gain.setValueAtTime(v, at + dur - .5); g.gain.linearRampToValueAtTime(0, at + dur); g.connect(this.send);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(g); [-7, 7].forEach(dt => { const o = this.osc('sawtooth', f, at, dur, lp); o.detune.value = dt; }); },

  // ---------- SFX ----------
  play(type, at, o) {
    const s = this.sfx, fn = this['sfx_' + type]; if (fn) fn.call(this, at, o, s);
  },
  tick(at, f = 2600, v = .12, dest) { const g = this.gain(dest || this.sfx, 0); this.env(g, at, .001, v, .04); this.osc('triangle', f, at, .05, g); },
  sfx_tick(at, o) { this.tick(at, o.f || 2600, o.v || .14); },
  sfx_pop(at, o) { const g = this.gain(this.sfx, 0); this.env(g, at, .002, (o.v || .22), .09); const os = this.osc('sine', 700 * (o.p || 1), at, .12, g); os.frequency.exponentialRampToValueAtTime(1500 * (o.p || 1), at + .05); g.connect(this.send); },
  sfx_whoosh(at, o) {
    const d = o.dur || .6, g = this.gain(this.sfx, 0), bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.connect(g);
    const up = o.dir !== 'down'; bp.frequency.setValueAtTime(up ? 300 : 3500, at); bp.frequency.exponentialRampToValueAtTime(up ? 3800 : 260, at + d);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime((o.v || .4), at + d * .7); g.gain.linearRampToValueAtTime(0, at + d); this.noise(at, d, bp);
  },
  sfx_impact(at, o) {
    const sz = o.size == null ? 1 : o.size, g = this.gain(this.sfx, 0); this.env(g, at, .002, .9 * sz, .7);
    const os = this.osc('sine', 110, at, .8, g); os.frequency.exponentialRampToValueAtTime(34, at + .5);
    const g2 = this.gain(this.sfx, 0); this.env(g2, at, .001, .45 * sz, .25); const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(g2); this.noise(at, .3, lp); g2.connect(this.send);
  },
  sfx_riser(at, o) {
    const d = o.dur || 2, g = this.gain(this.sfx, 0), bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3; bp.connect(g);
    bp.frequency.setValueAtTime(400, at); bp.frequency.exponentialRampToValueAtTime(6000, at + d);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(o.v || .3, at + d); g.gain.linearRampToValueAtTime(0, at + d + .03); this.noise(at, d, bp);
    const g3 = this.gain(this.sfx, 0); g3.gain.setValueAtTime(0, at); g3.gain.linearRampToValueAtTime(.05, at + d); g3.gain.linearRampToValueAtTime(0, at + d + .03);
    const os = this.osc('sawtooth', 110, at, d, g3); os.frequency.exponentialRampToValueAtTime(880, at + d);
  },
  sfx_swell(at, o) { const d = o.dur || 1.5, g = this.gain(this.sfx, 0), hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000; hp.connect(g); g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.35, at + d); g.gain.linearRampToValueAtTime(0, at + d + .02); this.noise(at, d, hp); },
  sfx_chime(at, o) { const base = o.f || 1046.5; [0, o.up == null ? 7 : o.up].forEach((st, i) => { const g = this.gain(this.sfx, 0); this.env(g, at + i * .07, .003, .13, .7); g.connect(this.send); this.osc('triangle', base * Math.pow(2, st / 12), at + i * .07, .8, g); }); },
  sfx_ding(at, o) { [1, 2.76, 5.4].forEach((m, i) => { const g = this.gain(this.sfx, 0); this.env(g, at, .002, .16 / (i + 1), 1.4 / (i + 1)); g.connect(this.send); this.osc('sine', (o.f || 1318.5) * m, at, 1.5, g); }); },
  sfx_ping(at, o) { const g = this.gain(this.sfx, 0); this.env(g, at, .002, .12, .5); g.connect(this.send); this.osc('sine', o.f || 1760, at, .6, g); },
  sfx_click(at, o) { this.tick(at, 4200, .3); const g = this.gain(this.sfx, 0); this.env(g, at + .01, .001, .5 * (o.v || 1), .09); const os = this.osc('square', 180, at + .01, .1, g); os.frequency.exponentialRampToValueAtTime(60, at + .08); },
  sfx_heart(at) { [0, .22].forEach((d, i) => { const g = this.gain(this.sfx, 0); this.env(g, at + d, .004, i ? .35 : .5, .22); const os = this.osc('sine', 80, at + d, .3, g); os.frequency.exponentialRampToValueAtTime(40, at + d + .2); }); },
  sfx_type(at, o) { const n = o.n || 8; for (let i = 0; i < n; i++) this.tick(at + i * (o.gap || .055) + Math.random() * .015, 1800 + Math.random() * 1600, .06); },
  sfx_buzz(at) { [0, .16].forEach(d => { const g = this.gain(this.sfx, 0); this.env(g, at + d, .005, .12, .12); const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g); this.osc('square', 150, at + d, .14, lp); }); },
  sfx_combo(at) { [0, 4, 7, 12, 16].forEach((st, i) => { const g = this.gain(this.sfx, 0); this.env(g, at + i * .06, .003, .12, .9); g.connect(this.send); this.osc('triangle', 523.25 * Math.pow(2, st / 12), at + i * .06, 1, g); }); },
  sfx_stab(at, o) { const ch = PROG[(o.i || 0) % 4]; ch.forEach(m => { const g = this.gain(this.sfx, 0); this.env(g, at, .004, .07, .35); const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(g); g.connect(this.send); this.osc('sawtooth', mtof(m + 12), at, .4, lp); }); },
  sfx_shimmer(at, o) { const d = o.dur || 1.2; [2093, 2637, 3136].forEach((f, i) => { const g = this.gain(this.sfx, 0); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.04, at + d * .3); g.gain.linearRampToValueAtTime(0, at + d); g.connect(this.send); this.osc('sine', f, at + i * .03, d, g); }); },
  sfx_glitch(at) { for (let i = 0; i < 4; i++) { const g = this.gain(this.sfx, 0); this.env(g, at + i * .03, .001, .12, .02); const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000 + i * 1500; hp.connect(g); this.noise(at + i * .03, .03, hp); } },
  sfx_hit(at, o) { this.kick(at, 1); this.sfx_impact(at, { size: o.size == null ? .7 : o.size }); }
};

/* ===== 06-voice.js ===== */
/* ============================================================================
   6. VOICE — narração com Web Speech API (speechSynthesis)
   ----------------------------------------------------------------------------
   • Cada frase dispara no seu cue (CONFIG.narration) → sincronia por frase.
   • Prefere voz feminina pt-BR; aplica grafia fonética aos termos em inglês.
   • Para trocar por locução gravada: desligue a voz (CONFIG.audio.voice=false)
     e use os mesmos tempos de CONFIG.narration como guia de edição.
   ========================================================================== */
const VOICE = {
  supported: 'speechSynthesis' in window, voice: null, idx: 0, active: 0, bad: new Set(), current: null,

  init(onPick) {
    if (!this.supported) { onPick && onPick(null); return; }
    const pick = () => { this.voice = this.choose(); onPick && onPick(this.voice); };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  choose() {
    const vs = speechSynthesis.getVoices().filter(v => !this.bad.has(v.name)); if (!vs.length) return null;
    const A = CONFIG.audio, score = v => {
      let s = 0; const lang = (v.lang || '').toLowerCase().replace('_', '-'), nm = v.name;
      if (lang === 'pt-br') s += 100; else if (lang.startsWith('pt')) s += 40; else return -1;
      const pi = A.preferredVoices.findIndex(p => nm.includes(p)); if (pi >= 0) s += 50 - pi;
      if (A.avoidVoices.some(p => nm.includes(p))) s -= 80;
      if (/natural|neural|online/i.test(nm)) s += 12;
      return s;
    };
    return vs.map(v => [score(v), v]).filter(a => a[0] > 0).sort((a, b) => b[0] - a[0]).map(a => a[1])[0] || null;
  },
  spoken(str) { let s = str; CONFIG.phonetics.forEach(([re, rep]) => { s = s.replace(re, rep); }); return s; },

  /** reposiciona após seek/pause */
  reset(T) {
    if (this.supported) speechSynthesis.cancel();
    this.active = 0; AUDIO.setDuck && AUDIO.ready && AUDIO.setDuck(false);
    this.idx = CONFIG.narration.findIndex(n => n.t >= T - .05); if (this.idx < 0) this.idx = CONFIG.narration.length;
  },
  update(T, playing) {
    const N = CONFIG.narration;
    while (this.idx < N.length && N[this.idx].t <= T) {
      const n = N[this.idx++];
      if (playing && CONFIG.audio.voice && this.supported && T - n.t < .8) this.speak(n);
    }
  },
  speak(n) {
    const u = new SpeechSynthesisUtterance(this.spoken(n.text));
    u.lang = 'pt-BR'; if (this.voice) u.voice = this.voice;
    u.rate = CONFIG.audio.voiceRate * (n.rate || 1); u.pitch = CONFIG.audio.voicePitch; u.volume = 1;
    u.onstart = () => { this.active++; AUDIO.ready && AUDIO.setDuck(true); };
    const end = () => { this.active = Math.max(0, this.active - 1); if (!this.active && AUDIO.ready) AUDIO.setDuck(false); };
    u.onend = end;
    u.onerror = (e) => { end(); if (this.voice && e.error && e.error !== 'interrupted' && e.error !== 'canceled') { this.bad.add(this.voice.name); this.voice = this.choose(); } };
    speechSynthesis.speak(u);
  },
  pause() { if (this.supported) speechSynthesis.cancel(); this.active = 0; },

  /** legenda atual (texto da frase em curso) */
  caption(T) {
    const N = CONFIG.narration; let cur = null;
    for (let i = 0; i < N.length; i++) { if (N[i].t <= T) cur = N[i]; else break; }
    if (!cur) return null; const next = N[N.indexOf(cur) + 1];
    const end = Math.min(next ? next.t : Infinity, cur.t + Math.max(1.6, cur.text.length * .068));
    return T < end ? cur.text : null;
  }
};

/* ===== 08-music.js ===== */
/* ============================================================================
   8. MÚSICA — faixas embutidas tocando em sincronia com a linha do tempo,
   e leitura das batidas (BEAT) para câmera, cores e elementos.
   ----------------------------------------------------------------------------
   • As faixas ficam em sources.js (PA_MUSIC[id].data, MP3 em base64), na mesma pasta do HTML,
     geradas pelo build a partir de musica/ (fora do Git).
   • BEAT.at(T) é função pura do tempo: seek e pausa continuam exatos.
   ========================================================================== */
const TRACKS = (() => {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const out = {};
  for (const id in BEATS) {
    const d = BEATS[id], env = {};
    for (const k in d.env) env[k] = bytes(d.env[k]);
    out[id] = { id, data: d, env, hitT: d.hits.map(h => h[0]), buf: null, embedded: !!MUSIC_SRC(id) };
  }
  return out;
})();

const TRACK = {
  gain: null, srcs: [],
  ready(id) { return !!(TRACKS[id] && TRACKS[id].buf); },
  embedded(id) { return !!(TRACKS[id] && TRACKS[id].embedded); },
  bus() {
    if (!this.gain) { this.gain = AUDIO.ctx.createGain(); this.gain.gain.value = 0; this.gain.connect(AUDIO.master); }
    this.apply(); return this.gain;
  },
  apply() {
    if (!this.gain) return; const a = CONFIG.audio;
    this.gain.gain.setTargetAtTime(a.music ? a.trackVolume * AUDIO.duck : 0, AUDIO.ctx.currentTime, .06);
  },
  /** agenda as faixas dos plays a partir do instante T da linha do tempo (o AUDIO já marcou t0v/t0c) */
  schedule(T) {
    this.stopAll(); const ctx = AUDIO.ctx; if (!ctx) return;
    CONFIG.plays.forEach(p => {
      if (!p.track || p.end <= T + .02 || !this.ready(p.track)) return;
      const s = Math.max(T, p.start), when = AUDIO.ctxTime(s), late = Math.max(0, ctx.currentTime - when);
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = TRACKS[p.track].buf; g.gain.value = (CONFIG.audio.tracks[p.track] || {}).gain || 1;
      src.connect(g); g.connect(this.bus());
      src.start(when + late, p.from + (s - p.start) + late, Math.max(.01, p.end - s - late));
      this.srcs.push(src);
    });
  },
  stopAll() { this.srcs.forEach(s => { try { s.stop(); } catch (e) {} }); this.srcs = []; },
  /** quando uma faixa termina de decodificar com o vídeo já tocando, entra no ponto certo */
  onReady() { if (AUDIO.playing && AUDIO.ctx) this.schedule(AUDIO.t0v + (AUDIO.ctx.currentTime - AUDIO.t0c)); }
};

/* ---------------------------------------------------------------------------
   PAUSE (v7.16–v7.17) — a música das conversas: é a trilha da abertura (a parte zero) e segue sem emenda para a
   Conversa 0, onde desce para o fundo; nas baldeações e no encerramento entra do começo em fade. Em todas, repete
   sem fim (a música inteira ou um trecho de frases, conforme a faixa) até alguém seguir; sai em fade quando o
   vídeo continua. M (som) silencia.
   --------------------------------------------------------------------------- */
const PAUSE = {
  buf: null, g: null, on: false, voices: [], next: 0, off: 0, timer: null, fresh: false, mode: 'stop',
  el() { const c = CONFIG.audio.pause; return c ? MUSIC_SRC(c.track) : null; },
  /** o config do player, com o laço e o volume que vieram com a faixa (PA_MUSIC.pausa.attrs, de tools/pausa.py) por cima */
  cfg() {
    const c = { ...(CONFIG.audio.pause || {}) }, a = (this.el() || {}).attrs || {};
    ['loop', 'xfade', 'gain', 'openGain'].forEach(k => { if (a[k] != null) c[k] = a[k]; });
    return c;
  },
  wants(stopId) { const c = CONFIG.audio.pause || {}; return !!(c.track && (c.stops || []).includes(stopId)); },
  /** v7.18: o 1º drop da faixa e a grade de tempos a partir dele (data-drop, data-beat0, data-beat) */
  info() { const a = (this.el() || {}).attrs || {}; return { drop: a.drop != null ? +a.drop : null, beat0: a.beat0 != null ? +a.beat0 : null, beat: a.beat != null ? +a.beat : null }; },
  /** na abertura, onde a faixa está quando o play começa: o drop cai no instante SCENES.open.musicSync (as portas do trem abrem) */
  openOffset() { const i = this.info(), sync = SCENES.open && SCENES.open.musicSync; return i.drop != null && sync != null ? i.drop - sync : 0; },
  level(mode = this.mode) { const a = CONFIG.audio, c = this.cfg(), g = mode === 'open' ? (c.openGain == null ? 1 : c.openGain) : (c.gain == null ? .4 : c.gain); return a.music ? g * a.trackVolume : 0; },
  /** o trecho que se repete [s, e) e a transição x entre as voltas (x = 0: volta ao começo sem transição, como "repetir" num player) */
  span() { const c = this.cfg(), d = this.buf.duration, L = c.loop && c.loop[1] > c.loop[0] ? [c.loop[0], Math.min(c.loop[1], d)] : [0, d];
    return { s: L[0], e: L[1], x: Math.max(0, Math.min(c.xfade == null ? .3 : c.xfade, (L[1] - L[0]) / 4, L[0])) }; },
  begin(offset, mode, fade, when = 0) {
    AUDIO.init(); if (!AUDIO.ready || !this.buf) return;
    const ctx = AUDIO.ctx; let n = Math.max(when || 0, ctx.currentTime + .02); ctx.resume();
    if (offset < 0) { n += -offset; offset = 0; }   // a faixa ainda não começou nesse ponto do vídeo
    this.mode = mode; this.g = ctx.createGain(); this.g.gain.setValueAtTime(0, n); this.g.gain.linearRampToValueAtTime(this.level(), n + fade); this.g.connect(AUDIO.master);
    this.on = true; this.voices = []; this.next = n; this.off = Math.max(0, offset); this.fresh = true;
    this.pump(); clearInterval(this.timer); this.timer = setInterval(() => this.pump(), 400);
  },
  /** abertura (a parte zero): a música é a trilha do play, no nível do filme, a partir do ponto em que o vídeo está;
   *  when = instante do relógio de áudio em que o vídeo está em local (o mesmo das faixas do filme, AUDIO.ctxTime) */
  playFrom(local, when) { if (this.on) this.stop(.15); this.begin(local + this.openOffset(), 'open', local > .05 ? .3 : .05, when); },
  /** parada: se a música já vem tocando (da abertura), segue sem emenda e só desce para o fundo; senão entra do começo em fade */
  start(stopId) {
    if (!this.wants(stopId)) { this.stop(); return; }
    if (this.on) {
      if (this.mode !== 'stop') { this.mode = 'stop'; const n = AUDIO.ctx.currentTime; this.g.gain.cancelScheduledValues(n); this.g.gain.setValueAtTime(this.g.gain.value, n); this.g.gain.linearRampToValueAtTime(this.level(), n + (this.cfg().duck || 2)); }
      return;
    }
    if (this.buf) this.begin(0, 'stop', this.cfg().fadeIn || 2);
  },
  /** agenda as voltas com antecedência: cada volta nova entra x s antes do fim da anterior, com fade cruzado linear.
   *  As duas vozes saem do mesmo buffer, então o laço não depende do atraso do decodificador de MP3. */
  pump() {
    if (!this.on) return; const ctx = AUDIO.ctx, { s, e, x } = this.span();
    while (this.next < ctx.currentTime + 3) {
      const t0 = this.next, o = Math.min(this.off, e - .01), first = this.fresh, src = ctx.createBufferSource(), vg = ctx.createGain();
      this.fresh = false; src.buffer = this.buf; src.connect(vg); vg.connect(this.g);
      if (first || x <= 0) vg.gain.setValueAtTime(1, t0); else { vg.gain.setValueAtTime(0, t0); vg.gain.linearRampToValueAtTime(1, t0 + x); }
      const tx = t0 + Math.max(0, e - x - o);
      if (x > 0) { vg.gain.setValueAtTime(1, tx); vg.gain.linearRampToValueAtTime(0, tx + x); }
      src.start(t0, o); src.stop(tx + x + .02);
      this.voices.push(src); src.onended = () => { this.voices = this.voices.filter(v => v !== src); };
      this.next = tx; this.off = s - x;
    }
  },
  apply() { if (this.g && AUDIO.ctx) { const n = AUDIO.ctx.currentTime; this.g.gain.cancelScheduledValues(n); this.g.gain.setTargetAtTime(this.level(), n, .15); } },
  stop(fade) {
    if (!this.on) return; this.on = false; clearInterval(this.timer);
    const ctx = AUDIO.ctx, g = this.g, f = fade == null ? (this.cfg().fadeOut || 1.2) : fade, vs = this.voices; this.g = null; this.voices = [];
    if (!ctx || !g) return; const n = ctx.currentTime;
    g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.linearRampToValueAtTime(0, n + f);
    vs.forEach(v => { try { v.stop(n + f + .05); } catch (err) {} });
    setTimeout(() => { try { g.disconnect(); } catch (err) {} }, (f + .3) * 1000);
  },
  /** quando a faixa termina de decodificar com uma parada já na tela */
  onReady() { const st = window.__state; if (st && st.mode === 'stop' && CONFIG.stops[st.stop]) this.start(CONFIG.stops[st.stop].id); }
};

/* decodifica as faixas logo no carregamento (contexto offline: não precisa de gesto do usuário) */
(function decodeTracks() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return;
  const oac = new OAC(2, 44100, 44100);
  Object.values(TRACKS).forEach(tr => {
    const src = MUSIC_SRC(tr.id); if (!src) return;
    const raw = atob(src.data), buf = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    oac.decodeAudioData(buf.buffer).then(b => { tr.buf = b; TRACK.onReady(); })
      .catch(e => console.warn('[música] não deu para decodificar', tr.id, e));
  });
  // v7.16: a música das conversas (não tem grade de batidas: não mexe nas cenas)
  const pc = CONFIG.audio.pause, pel = pc && MUSIC_SRC(pc.track);
  if (pel) { const raw = atob(pel.data), buf = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    oac.decodeAudioData(buf.buffer).then(b => { PAUSE.buf = b; PAUSE.onReady(); }).catch(e => console.warn('[música] não deu para decodificar', pc.track, e)); }
})();

/* ---------------------------------------------------------------------------
   BEAT — estado da música no instante T (0–1 em tudo):
   beat  pulso no tempo (1 na batida, cai rápido) · down  idem no 1º tempo do compasso
   kick/snare  ataques de grave e de caixa/chimbal · low/level  nível do grave e geral
   hit   picos fortes · drop  virada de seção · phase/bar  posição no tempo/compasso
   i/di  índice da batida/do compasso (para alternar efeitos)
   --------------------------------------------------------------------------- */
const BEAT = (() => {
  const idx = (arr, x) => { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= x) { r = m; lo = m + 1; } else hi = m - 1; } return r; };
  function env(tr, k, x) {

  const s = CONFIG.sceneById[id], p = CONFIG.playById[s.play];
  if (!p.track || !BEATS[p.track]) { const per = 60 / CONFIG.bpm, n = Math.ceil(s.dur / per); return GRIDS[id] = { beats: Array.from({ length: n }, (_, i) => i * per), bars: Array.from({ length: Math.ceil(n / 4) }, (_, i) => i * per * 4) }; }
  const d = BEATS[p.track], off = p.from + (s.start - p.start), loc = arr => arr.map(x => +(x - off).toFixed(3)).filter(x => x >= -1e-3 && x < s.dur);
  // a grade cobre a cena inteira: onde o detector parou (fim de faixa, trecho filtrado) ela segue no mesmo período
  const med = a => { const d2 = a.slice(1).map((x, i) => x - a[i]).sort((u, v) => u - v); return d2.length ? d2[d2.length >> 1] : 0; };
  const ext = (a, per) => { if (!a.length || !(per > .1)) return a; const o = a.slice();
    while (o[o.length - 1] + per < s.dur + per) o.push(+(o[o.length - 1] + per).toFixed(3));
    while (o[0] - per > -1e-3) o.unshift(+(o[0] - per).toFixed(3)); return o; };
  const B = loc(d.beats), D = loc(d.down), pb = med(B) || 60 / (d.bpm || 110);
  return GRIDS[id] = { beats: ext(B, pb), bars: ext(D, med(D) || pb * 4) };
}
/** encaixa um tempo LOCAL da cena na batida ('beat') ou no começo de compasso ('bar') mais próximo da faixa do play */
function onBeat(id, t, unit = 'beat') {
  const a = unit === 'bar' ? grid(id).bars : grid(id).beats; if (!a.length) return t;
  let b = a[0]; for (const x of a) if (Math.abs(x - t) < Math.abs(b - t)) b = x; return b;
}
/** a n-ésima batida depois da batida mais próxima de t (para entradas em sequência, uma por batida) */
function beatsFrom(id, t, n = 0) {
  const a = grid(id).beats; if (!a.length) return t + n * .5;
  let i = 0; for (let k = 0; k < a.length; k++) if (Math.abs(a[k] - t) < Math.abs(a[i] - t)) i = k;
  const per = a.length > 1 ? (a[a.length - 1] - a[0]) / (a.length - 1) : .5;
  return a[i + n] != null ? a[i + n] : a[a.length - 1] + (i + n - a.length + 1) * per;
}

/* ---------- split-flap ---------- */
const FLAP = {
  CH: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
  /** estado da placa i no instante t: frases (já com o mesmo comprimento) trocam nos tempos `times` */
  state(i, t, phrases, times, step = .055) {
    let k = -1; times.forEach((t0, j) => { if (t >= t0) k = j; });
    if (k < 0) return { cur: ' ', nxt: ' ', q: 0, k };
    const target = phrases[k][i] || ' ', prev = k <= 0 ? ' ' : (phrases[k - 1][i] || ' ');
    const start = times[k] + i * .03, dur = prev === target ? 0 : .25 + hash(i * 7 + k) * .4;
    if (t < start) return { cur: prev, nxt: prev, q: 0, k: k - 1 };
    if (t >= start + dur) return { cur: target, nxt: target, q: 0, k };
    const f = (t - start) / step, n = Math.floor(f), last = Math.floor(dur / step);
    const rc = m => (m <= 0 ? prev : m >= last ? target : FLAP.CH[Math.floor(hash(i * 31 + k * 7 + m) * FLAP.CH.length)]);
    return { cur: rc(n), nxt: rc(n + 1), q: f - n, k };
  },
  tile(ctx, x, y, w, h, st, hi, glowA = 0) {
    const mid = y + h / 2, col = hi ? C.orange : '#F6EDDD', fnt = font(h * .66, 900);
    paper(ctx, x, y, w, h, { r: Math.max(3, h * .07), fill: '#1F1A15', outline: '#000', shadow: Math.max(2, h * .045), shadowColor: '#000', lw: Math.max(1.5, h * .018) });
    if (glowA > 0 && hi) glow(ctx, x + w / 2, mid, w * 1.2, C.orange, .35 * glowA);
    const ch = (c, top) => { ctx.save(); ctx.beginPath(); ctx.rect(x, top ? y : mid, w, h / 2); ctx.clip(); ctx.font = fnt; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(c, x + w / 2, mid + h * .03); ctx.restore(); };
    ch(st.nxt, true); ch(st.cur, false);
    if (st.q > 0 && st.cur !== st.nxt) {
      ctx.save(); ctx.translate(0, mid);
      if (st.q < .5) { ctx.scale(1, 1 - st.q * 2); ctx.translate(0, -mid); ctx.fillStyle = '#26201A'; ctx.fillRect(x + 2, y + 2, w - 4, h / 2 - 2); ch(st.cur, true); }
      else { ctx.scale(1, (st.q - .5) * 2); ctx.translate(0, -mid); ctx.fillStyle = '#26201A'; ctx.fillRect(x + 2, mid, w - 4, h / 2 - 2); ch(st.nxt, false); }
      ctx.restore();
    }
    line(ctx, x + 2, mid, x + w - 2, mid, 'rgba(0,0,0,.85)', Math.max(1.5, h * .025));
  },
  /** letreiro inteiro: frases trocando nos tempos `times`, a partir da placa `hiFrom[k]` em laranja */
  board(ctx, cx, cy, phrases, times, t, o = {}) {
    const len = Math.max(...phrases.map(s => s.length)), ph = phrases.map(s => s.padEnd(len, ' '));
    const tw = o.tw || 60, th = o.th || tw * 1.45, gap = o.gap == null ? tw * .1 : o.gap, bw = len * (tw + gap) - gap, bx = cx - bw / 2, pad = tw * .4;
    paper(ctx, bx - pad, cy - th / 2 - pad - (o.header ? th * .45 : 0), bw + pad * 2, th + pad * 2 + (o.header ? th * .45 : 0), { r: tw * .25, fill: '#14110E', outline: '#000', shadow: tw * .15, shadowColor: '#000', lw: 3 });
    if (o.header) { ctx.save(); ctx.translate(bx + o.header.length * th * .11 + 10, cy - th / 2 - th * .3); ctx.rotate(-.015);
      const hw = measure(ctx, o.header, th * .2, 800, true, 3) + th * .4; paper(ctx, -hw / 2, -th * .16, hw, th * .32, { r: 4, fill: o.headerCol || C.red, shadow: 3, shadowColor: '#000', lw: 2 });
      text(ctx, o.header, 0, 1, { size: th * .2, weight: 800, mono: true, color: '#FFF', align: 'center', ls: 3 }); ctx.restore(); }
    for (let i = 0; i < len; i++) { const s = FLAP.state(i, t, ph, times), k = Math.max(0, s.k); FLAP.tile(ctx, bx + i * (tw + gap), cy - th / 2, tw, th, s, o.hiFrom ? i >= o.hiFrom[k] && s.cur !== ' ' : false, o.glowA || 0); }
    return { x: bx - pad, y: cy - th / 2 - pad, w: bw + pad * 2, h: th + pad * 2 };
  }
};

/* ---------- mapa do metrô ---------- */
/** quebra um rótulo em duas linhas no espaço mais perto do meio */
function twoLines(s) { const sp = [...s].map((c, i) => c === ' ' ? i : -1).filter(i => i > 0); if (!sp.length) return s; const m = sp.reduce((a, b) => Math.abs(b - s.length / 2) < Math.abs(a - s.length / 2) ? b : a); return s.slice(0, m) + '\n' + s.slice(m + 1); }
// nós: partida, 01, 02, 03, parada 1, 04, 05, 06, parada 2, 07, e a linha seguindo para o futuro
const MAP = (() => {
  const nodes = [
    { k: 'start', x: 170, y: 300 }, { k: 1, x: 430, y: 300 }, { k: 2, x: 700, y: 300 }, { k: 3, x: 970, y: 300 }, { k: 'p1', x: 1290, y: 300 },
    { k: 4, x: 1290, y: 600 }, { k: 5, x: 1000, y: 600 }, { k: 6, x: 710, y: 600 }, { k: 'p2', x: 420, y: 600 },
    { k: 7, x: 560, y: 880 }, { k: 'end', x: 980, y: 880 }
  ];
  // caminho: retas entre nós + curvas nas viradas
  const path = [[170, 300], [1290, 300], [1560, 300], [1660, 380], [1660, 520], [1560, 600], [420, 600], [260, 600], [180, 680], [180, 800], [260, 880], [980, 880]];
  const seg = []; let L = 0;
  for (let i = 1; i < path.length; i++) { const [x0, y0] = path[i - 1], [x1, y1] = path[i], l = Math.hypot(x1 - x0, y1 - y0); seg.push({ x0, y0, x1, y1, l, a: L }); L += l; }
  const at = u => { const d = clamp(u) * L; for (const s of seg) if (d <= s.a + s.l) { const f = (d - s.a) / s.l; return [lerp(s.x0, s.x1, f), lerp(s.y0, s.y1, f)]; } const s = seg[seg.length - 1]; return [s.x1, s.y1]; };
  const uOf = (x, y) => { let best = 0, bd = 1e9; for (const s of seg) for (let f = 0; f <= 1; f += .02) { const px = lerp(s.x0, s.x1, f), py = lerp(s.y0, s.y1, f), d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = (s.a + f * s.l) / L; } } return best; };
  nodes.forEach(n => { n.u = uOf(n.x, n.y); });
  const colAt = u => u < nodes[4].u ? C.red : u < nodes[8].u ? C.orange : C.yellow;
  return { nodes, path, L, at, colAt, node: k => nodes.find(n => n.k === k) };
})();

/** mapa completo: reveal = quanto da linha já foi traçada (0–1) · hi = nó em destaque · train = posição do trem (0–1) */
function metroMap(ctx, t, o = {}) {
  const rev = o.reveal == null ? 1 : o.reveal, hi = o.hi, A = o.alpha == null ? 1 : o.alpha; if (A <= 0) return;
  ctx.save(); ctx.globalAlpha *= A;
  // linha: contorno de tinta + cor do trecho, desenhada até `rev`
  const drawLine = (lw, colFn) => {
    const steps = 220; let prev = MAP.at(0);
    for (let s = 1; s <= steps; s++) { const u = s / steps; if (u > rev + 1e-6) break; const p = MAP.at(u);
      ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.strokeStyle = colFn(u); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(); prev = p; }
  };

  drawLine(38, () => INK); drawLine(24, u => MAP.colAt(u));

  if (rev >= .999 && o.future !== false) { ctx.save(); ctx.setLineDash([16, 18]); ctx.lineDashOffset = -t * 40; line(ctx, 1010, 880, 1760, 880, rgba(C.yellow, .8), 10); ctx.restore();
    text(ctx, 'FUTURO →', 1700, 840, { size: 22, weight: 800, mono: true, color: C.yellow, align: 'right', ls: 3, alpha: .9 }); }
  // estações e baldeações
  MAP.nodes.forEach(n => {
    if (n.k === 'start' || n.k === 'end') return;
    const show = E.outBack(clamp((rev - n.u) * 14 + .3)); if (show <= 0) return;
    const isHi = hi === n.k, pulse = isHi ? 1 + .08 * Math.sin(t * 5) : 1;
    ctx.save(); ctx.translate(n.x, n.y); ctx.scale(show * pulse, show * pulse);
    if (typeof n.k === 'string') intersection(ctx, 0, 0, 30, 36, { hot: isHi ? .6 : 0 });
    else { circle(ctx, 4, 5, 26, 'rgba(0,0,0,.6)'); circle(ctx, 0, 0, 26, isHi ? C.yellow : '#FFF8EE'); inkCircle(ctx, 0, 0, 26, 6, n.k);
      text(ctx, TX.stations[n.k - 1].n, 0, 1, { size: 20, weight: 900, color: INK, align: 'center' }); }
    ctx.restore();
    if (isHi) glow(ctx, n.x, n.y, 120, C.orange, .45);
    // rótulo
    const la = clamp((rev - n.u) * 10); if (la <= 0) return;
    const above = n.y < 450 ? -1 : 1, ly = n.y + above * (typeof n.k === 'string' ? 56 : 74);
    if (typeof n.k === 'string') text(ctx, TX.stop.label, n.x, ly, { size: 22, weight: 800, mono: true, color: C.yellow, align: 'center', ls: 3, alpha: la });
    else { const st = TX.stations[n.k - 1]; text(ctx, twoLines(st.short), n.x, ly, { size: isHi ? 26 : 22, weight: 900, color: isHi ? '#FFF' : '#EBDFCF', align: 'center', ls: .5, alpha: la, lh: 1.05 }); }
  });
  // trem (ponto laranja com brilho)
  if (o.train != null) { const [x, y] = MAP.at(o.train); glow(ctx, x, y, 90, C.orange, .6); circle(ctx, x, y, 16, C.orange); inkCircle(ctx, x, y, 16, 4, 77); circle(ctx, x - 5, y - 5, 4, '#FFE0C0'); }
  ctx.restore();
}

/** mini-mapa no canto durante os trechos: 7 estações + 2 baldeações, trem andando */
function miniMap(ctx, T, a = 1) {
  if (a <= 0) return;
  const seq = [1, 2, 3, 'p1', 4, 5, 6, 'p2', 7], x0 = W - 520, x1 = W - 98, y = 58, dx = (x1 - x0) / (seq.length - 1);   // v7: canto superior direito (o título fica à esquerda)
  const k = stationAt(T), s = sceneAt(T);
  // posição do trem: índice da estação atual + progresso na estação
  const order = seq.indexOf(k), ks = CONFIG.stationStart[k] || 0, ke = k < 7 ? (CONFIG.stationStart[k + 1] || CONFIG.duration) : CONFIG.duration;
  const prog = clamp((T - ks) / (ke - ks)), pos = order < 0 ? 0 : order + prog * (k === 3 || k === 6 ? 1 : (k === 7 ? .9 : 1));
  ctx.save(); ctx.globalAlpha *= a;
  rr(ctx, x0 - 34, y - 30, x1 - x0 + 68, 60, 30); ctx.fillStyle = 'rgba(14,11,9,.62)'; ctx.fill();
  for (let i = 0; i < seq.length - 1; i++) line(ctx, x0 + i * dx, y, x0 + (i + 1) * dx, y, i < 3 ? C.red : i < 7 ? C.orange : C.yellow, 8);
  seq.forEach((n, i) => { const x = x0 + i * dx;
    if (typeof n === 'string') { circle(ctx, x - 5, y, 9, C.red, INK, 2); circle(ctx, x + 5, y, 9, C.yellow, INK, 2); }
    else { const cur = n === k; circle(ctx, x, y, cur ? 13 : 9, cur ? C.yellow : '#FFF8EE', INK, 2.5); if (cur) text(ctx, TX.stations[n - 1].n, x, y + 1, { size: 12, weight: 900, color: INK, align: 'center' }); } });
  const tx = x0 + pos * dx; glow(ctx, tx, y, 40, C.orange, .55 + .3 * BT.beat); circle(ctx, tx, y, 7 + 2 * BT.beat, C.orange, '#FFF', 2);
  if (k) { const lb = `${TX.stations[k - 1].n} · ${TX.stations[k - 1].short}`, lw = measure(ctx, lb, 17, 800, true, 2) + 30;
    rr(ctx, x1 + 34 - lw, y + 36, lw, 32, 16); ctx.fillStyle = 'rgba(14,11,9,.7)'; ctx.fill();
    text(ctx, lb, x1 + 34 - lw / 2, y + 53, { size: 17, weight: 800, mono: true, color: '#FFF', ls: 2, align: 'center', alpha: .92 }); }
  ctx.restore();
}

/** letreiro da estação: desce no início de cada estação, vira as placas e sobe para o mini-mapa */
function stationBoard(ctx, T) {
  for (let k = 1; k <= 7; k++) {
    const Ts = CONFIG.stationStart[k]; if (Ts == null || T < Ts || T > Ts + 4) continue;
    const t = T - Ts - .35, st = TX.stations[k - 1], ph = [`${st.n} ${st.short}`]; if (t < 0) continue;
    const din = E.outBack(P(t, 0, .5)), dout = E.inCubic(P(t, 3.3, .6));
    const y = lerp(-120, 118, din) - 200 * dout, s = lerp(1, .5, dout);
    ctx.save(); ctx.globalAlpha *= 1 - dout; ctx.translate(W / 2, y); ctx.scale(s, s);
    FLAP.board(ctx, 0, 0, ph, [.15], t, { tw: 40, th: 58, hiFrom: [3], header: `ESTAÇÃO ${st.n}`, headerCol: C.red });
    const title = st.title, pa = P(t, .9, .4);
    if (pa > 0) { ctx.save(); ctx.globalAlpha *= pa; ctx.translate(0, 70 + (1 - E.outBack(pa)) * 20); ctx.rotate(-.01);
      const tw = measure(ctx, title, 26, 800) + 60; paper(ctx, -tw / 2, -22, tw, 44, { torn: true, seed: 40 + k, fill: PAPER, shadow: 5, shadowColor: '#000', lw: 2.5 });
      text(ctx, title, 0, 1, { size: 26, weight: 800, color: INK, align: 'center' }); ctx.restore(); }
    ctx.restore();
  }
}
// "plim-plom" de metrô e o tac-tac das placas a cada estação
CONFIG.scenes.forEach(s => {
  if (!s.station || CONFIG.stationStart[s.station] !== s.start) return;
  cue(s.id, 0, 'chime', { f: 987.8, up: -4 }); cue(s.id, .18, 'type', { n: 14, gap: .028 });

/** sobreposição dos trechos: mini-mapa (depois da abertura) + letreiro de estação */
function overlayPlay(ctx, T, s) {
  const t = T - s.start;
  if (s.play > 1) { miniMap(ctx, T, P(T, CONFIG.playById[2].start, .6) * (SCENES[s.id] && SCENES[s.id].hideMap ? .0 : 1)); nextStationLED(ctx, T); }
  captionStrip(ctx, s, t);

  TRAIN_PASS.draw(ctx, T);
}

/* ---------- plataforma das paradas (v7.11): estação futurista, arejada e verde ----------

/** v7.11: o trem da linha é um TREM BALA visto de lado. (x, y) = canto superior esquerdo do corpo do vagão; base L × 408 em escala s
 *  (as rodas, escondidas pela saia, tocam o trilho em y = 408). o: len, open (abre as portas), lit (luz interna), seed, label,
 *  doors, logoX, nose: 'right' | 'left' | 'both' (o nariz aerodinâmico fica fora de [0, L]), noseLen */
const NOSE_LEN = 460;
function trainCar(ctx, x, y, s, o = {}) {
  const L = o.len || 1000, open = clamp(o.open || 0), lit = o.lit == null ? 1 : o.lit, R = rng(o.seed || 3), N = o.noseLen || NOSE_LEN;
  const doors = o.doors || [L * .25, L * .75], DW = 128, TOP = 22, BOT = 372, WY = 96, WH = 70;
  const nr = o.nose === 'right' || o.nose === 'both', nl = o.nose === 'left' || o.nose === 'both';

  const shell = () => { ctx.beginPath();
    if (nl) ctx.moveTo(0, TOP); else { ctx.moveTo(56, TOP); }
    if (nr) { ctx.lineTo(L, TOP); ctx.bezierCurveTo(L + N * .5, TOP, L + N * .95, 190, L + N, 304); ctx.quadraticCurveTo(L + N * 1.01, BOT, L + N * .72, BOT); }
    else { ctx.lineTo(L - 56, TOP); ctx.arcTo(L, TOP, L, TOP + 56, 56); ctx.lineTo(L, BOT - 24); ctx.arcTo(L, BOT, L - 24, BOT, 24); }
    if (nl) { ctx.lineTo(-N * .72, BOT); ctx.quadraticCurveTo(-N * 1.01, BOT, -N, 304); ctx.bezierCurveTo(-N * .95, 190, -N * .5, TOP, 0, TOP); }
    else { ctx.lineTo(24, BOT); ctx.arcTo(0, BOT, 0, BOT - 24, 24); ctx.lineTo(0, TOP + 56); ctx.arcTo(0, TOP, 56, TOP, 56); }
    ctx.closePath(); };
  const x0 = nl ? -N : 0, x1 = nr ? L + N : L;

  ctx.save(); ctx.globalAlpha *= .3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse((x0 + x1) / 2, 408, (x1 - x0) / 2, 14, 0, 0, TAU); ctx.fill(); ctx.restore();
  [L * .16, L * .84].forEach(bx => { rr(ctx, bx - 96, BOT - 6, 192, 36, 12); ctx.fillStyle = '#23292C'; ctx.fill(); [-50, 50].forEach(dx => circle(ctx, bx + dx, BOT + 24, 14, '#3A4246')); });
  // corpo branco com a luz do alto
  shell(); const g = ctx.createLinearGradient(0, TOP, 0, BOT); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.55, '#EEF1F0'); g.addColorStop(1, '#CBD2D1'); ctx.fillStyle = g; ctx.fill();
  ctx.save(); shell(); ctx.clip();

  ctx.fillStyle = '#2C3437'; ctx.fillRect(x0 - 10, 326, x1 - x0 + 20, 60);
  line(ctx, x0, 214, x1, 214, 'rgba(120,132,136,.35)', 3);
  [[C.red, 280], [C.orange, 292], [C.yellow, 304]].forEach(([c, yy]) => { ctx.fillStyle = c; ctx.fillRect(x0 - 10, yy, x1 - x0 + 20, 10); });
  // faixa contínua de janelas (vidro escuro, interior aceso) e os passageiros
  rr(ctx, 40, WY, L - 80, WH, 22); const gw = ctx.createLinearGradient(0, WY, 0, WY + WH);
  gw.addColorStop(0, mix('#1B2830', '#3A2E22', lit * .5)); gw.addColorStop(1, mix('#22343D', '#8A5A2E', lit * .45)); ctx.fillStyle = gw; ctx.fill();
  for (let k = 0; k < Math.floor(L / 110); k++) { const hx = 70 + k * 110 + R() * 40; if (R() < .45) { ctx.fillStyle = 'rgba(10,14,16,.55)'; circle(ctx, hx, WY + 36, 11, 'rgba(10,14,16,.55)'); rr(ctx, hx - 18, WY + 48, 36, 30, 12); ctx.fill(); } }
  for (let k = 0; k < Math.ceil(L / 260); k++) { const rx = 80 + k * 260; ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.beginPath(); ctx.moveTo(rx, WY + 4); ctx.lineTo(rx + 70, WY + 4); ctx.lineTo(rx + 30, WY + WH - 4); ctx.lineTo(rx - 40, WY + WH - 4); ctx.closePath(); ctx.fill(); }
  // a janela da cabine segue a curva do nariz
  const cab = (sx, ex) => { ctx.beginPath(); ctx.moveTo(sx, WY); ctx.lineTo(ex(.18), WY); ctx.quadraticCurveTo(ex(.56), WY + 6, ex(.66), WY + WH + 4); ctx.lineTo(sx, WY + WH + 4); ctx.closePath();
    const gc = ctx.createLinearGradient(0, WY, 0, WY + WH); gc.addColorStop(0, '#16222A'); gc.addColorStop(1, '#2C4450'); ctx.fillStyle = gc; ctx.fill(); };

      ctx.strokeStyle = '#9AA4A7'; ctx.lineWidth = 3; ctx.stroke();

    });
    rr(ctx, d - 56, 30, 112, 22, 6); ctx.fillStyle = '#141B1E'; ctx.fill();
    text(ctx, o.label || 'ANALYTICS', d, 41, { size: 13, weight: 900, mono: true, color: C.orange, align: 'center', ls: 2 });
  });

  intersection(ctx, lx - 132, 248, 10, 12);
  text(ctx, 'PERFORMANCE ANALYTICS', lx - 114, 249, { size: 14, weight: 900, color: '#2C3437', ls: 1 });
  // reflexo do céu no teto
  const gr = ctx.createLinearGradient(0, TOP, 0, TOP + 60); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.fillRect(x0, TOP, x1 - x0, 60);

  ctx.restore();
}

/** o trem bala da linha visto de lado (ponte, viaduto dos pilares e 07): dois vagões, nariz na frente e na traseira.
 *  xf = ponta do nariz da frente · ry = topo do trilho · o farol pulsa com a música */
function sideTrain(ctx, xf, ry, o = {}) {
  const S = o.s || .17, L = 1000, GAP = 40, n = o.cars || 2, y = ry - 408 * S, k0 = S / .17, N = NOSE_LEN;
  glow(ctx, xf - 30 * k0, y + 268 * S, 150 * k0, '#FFE9C0', .22 + .18 * BT.level);
  for (let k = n - 1; k >= 0; k--) trainCar(ctx, xf - N * S - (k + 1) * L * S - k * GAP * S, y, S, { len: L, seed: (o.seed || 7) + k, lit: 1, doors: [L * .3, L * .7],
    nose: n === 1 ? 'both' : k === 0 ? 'right' : k === n - 1 ? 'left' : null });
  glow(ctx, xf - 40 * k0, y + 268 * S, 40 * k0, '#FFF6DA', .85);
}
/** comprimento total do trem bala em escala S (para quem posiciona o trem na tela) */
const trainLen = (S = .17, n = 2) => (n * 1000 + (n - 1) * 40 + 2 * NOSE_LEN) * S;

/* ---------- o trem passa na frente da câmera na chegada de cada estação (esconde o corte) ---------- */
const TRAIN_PASS = (() => {
  const S = 3.2, LEN = 1000, HALF = .5, list = [];
  const stopAt = T => CONFIG.mode !== 'reel' && CONFIG.stops.some(st => st.after && Math.abs(st.T - T) < 1e-3);
  for (let k = 1; k <= 7; k++) { const Ts = CONFIG.stationStart[k]; if (Ts == null) continue; list.push({ Ts, fromStop: stopAt(Ts) }); }
  list.forEach(p => { const sc = sceneAt(p.Ts + .01); cue(sc.id, Math.max(0, p.Ts - .35 - sc.start), 'whoosh', { dur: .9, v: .38 }); });
  return {
    list,
    draw(ctx, T) {
      list.forEach(p => {
        const u = (T - (p.Ts - HALF)) / (2 * HALF); if (u <= 0 || u >= 1 || (p.fromStop && u < .5)) return;
        const span = W + (LEN + NOSE_LEN) * S + 80, x = W + 40 + NOSE_LEN * S - span * u, y = -40;
        ctx.save(); ctx.globalAlpha = .28; trainCar(ctx, x + 70, y, S, { len: LEN, seed: 5, lit: .9, nose: 'left' }); ctx.restore();
        trainCar(ctx, x, y, S, { len: LEN, seed: 5, lit: .9, nose: 'left' });
      });
    }
  };
})();

/** painel de LED do vagão: "próxima estação" nos últimos segundos de cada estação */
function nextStationLED(ctx, T) {
  let nk = 0, Tn = 0;
  for (let k = 1; k <= 7; k++) { const Ts = CONFIG.stationStart[k]; if (Ts != null && Ts > T) { nk = k; Tn = Ts; break; } }
  const stop = CONFIG.mode !== 'reel' ? CONFIG.stops.find(st => st.after && st.T > T && (!nk || st.T <= Tn)) : null;
  if (stop) return;   // v7.12: sem o aviso "próxima parada"
  const target = Tn; if (!target || target - T > 4.5) return;
  const a = clamp((4.5 - (target - T)) / .3) * clamp((target - T - .1) / .3); if (a <= 0) return;
  const label = stop ? `PRÓXIMA PARADA  ›  ${stop.id === 'end' ? 'ENCERRAMENTO' : 'CONVERSA COM AS APRESENTADORAS'}` : `PRÓXIMA ESTAÇÃO  ›  ${TX.stations[nk - 1].n} ${TX.stations[nk - 1].short}`;
  const w = measure(ctx, label, 20, 800, true, 3) + 64, x = W - 64 - w, y = 214, blink = Math.floor(NOW * 2.5) % 2 ? 1 : .55;   // v7: abaixo do mini-mapa

  ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let k = 0; k < 9; k++) ctx.fillRect(x + 6, y - 22 + k * 5.4, w - 12, 1.6);
  ctx.restore();
}

/* ---------- legendas de tela (sem narrador, cada cena se explica sozinha) ----------
   SCENES[id].caps = [[t0, t1, 'texto com *destaque*', 'ETIQUETA', { top }], …] em tempo local da cena */
function captionStrip(ctx, s, t) {
  const caps = (SCENES[s.id] && SCENES[s.id].caps) || [];
  caps.forEach(([t0, t1, str, kick, opt]) => {
    const a = Math.min(P(t, t0, .35), 1 - P(t, t1 - .35, .35)); if (a <= 0) return;
    let size = 34; const plain = str.replace(/\*/g, ''), kw = kick ? measure(ctx, kick, 18, 800, true, 3) + 44 : 0;
    let tw = measure(ctx, plain, size, 800); const maxW = 1680 - kw; if (tw > maxW) { size *= maxW / tw; tw = maxW; }

    rich(ctx, str, x + 36 + kw, y + h / 2 + 1, { size, weight: 800, color: '#FFF', accent: C.yellow, align: 'left', ls: 0 });

/** cartão de conexão em tela cheia: etiqueta + frase grande (com *destaque*) + linha de apoio */
function bridgeCard(ctx, a, kicker, str, o = {}) {
  if (a <= 0) return; a = clamp(a);

  ctx.fillStyle = o.bg || '#120E0B'; ctx.fillRect(0, 0, W, H);

  line(ctx, 0, ly, W, ly, INK, 30); line(ctx, 0, ly, W, ly, o.lineCol || C.orange, 16);
  for (let k = -1; k < 8; k++) { const x = ((k * 300 - run) % (W + 300) + W + 300) % (W + 300) - 150; circle(ctx, x, ly, 18, '#FFF8EE', INK, 5); }
  glow(ctx, W / 2, H / 2 - 20, 700, C.orange, .18);

  if (kicker) { const kw = measure(ctx, kicker, 26, 800, true, 6) + 70; ctx.save(); ctx.translate(W / 2, H / 2 - 150); ctx.rotate(-.02);
    paper(ctx, -kw / 2, -28, kw, 56, { r: 6, fill: C.red, shadow: 6, shadowColor: '#000', lw: 3 }); text(ctx, kicker, 0, 2, { size: 26, weight: 800, mono: true, color: '#FFF', align: 'center', ls: 6 }); ctx.restore(); }
  ctx.save(); ctx.translate(W / 2, H / 2 - 20); ctx.scale(lerp(1.25, 1, e), lerp(1.25, 1, e));
  const pw = measure(ctx, str.replace(/\*/g, ''), size, 900) + 140; rr(ctx, -pw / 2, -size * .62, pw, size * 1.24, size * .2); ctx.fillStyle = '#2A1E15'; ctx.fill();   // v7.12: faixa lisa, sem pincelada
  rich(ctx, str, 0, 0, { size, weight: 900, color: '#FFF', accent: C.orange, retro: true, depth: 6, lw: 5 });
  ctx.restore();
  if (o.sub) text(ctx, o.sub, W / 2, H / 2 + 100, { size: 34, weight: 700, color: '#E9DDCC', align: 'center', alpha: clamp(a * 2 - .8) });
  ctx.restore();
}

/* ===== 12-paint.js ===== */
/* ============================================================================
   12. PINTURA, LUZ E VOLUME — acabamento "painterly" no espírito de Arcane
   ----------------------------------------------------------------------------
   • PAINT.post: pinceladas sobre o quadro inteiro, gradação de cor (luz quente
     no alto, sombra fria embaixo) e bloom dos pontos de luz. Roda depois da cena
     e antes das legendas, que ficam nítidas.
   • atmos: luz volumétrica e poeira no ar (eventos contínuos em paralelo).
   • vball / vlimb / vslab: formas com volume (luz do alto à esquerda, luz de
     recorte laranja do lado oposto) para personagens e objetos 2.5D.
   Tudo é função do tempo; no modo leve (QUALITY.low) o acabamento é pulado.
   ========================================================================== */
const PAINT = (() => {
  // textura de pinceladas em tons médios (aplicada em overlay: o cinza médio não altera, o resto "pinta")
  const STROKES = makeCanvas(1024, 1024, g => {
    const r = rng(31);
    for (let k = 0; k < 3200; k++) {
      const x = r() * 1024, y = r() * 1024, a = -.5 + (r() - .5) * .7, l = 18 + r() * 80, w = 3 + r() * 10, v = Math.floor(70 + r() * 116);
      for (const [dx, dy] of [[0, 0], [1024, 0], [-1024, 0], [0, 1024], [0, -1024]]) {
        if (Math.abs(x + dx - 512) > 512 + l || Math.abs(y + dy - 512) > 512 + l) continue;
        g.save(); g.translate(x + dx, y + dy); g.rotate(a); g.globalAlpha = .06 + r() * .12; g.fillStyle = `rgb(${v},${v},${v})`;
        g.beginPath(); g.ellipse(0, 0, l, w, 0, 0, TAU); g.fill(); g.restore();
      }
    }
  });
  const SM = makeCanvas(240, 135, () => {}), sg = SM.getContext('2d');
  let pat = null;
  return {
    STROKES,
    /** acabamento pintado do quadro inteiro (o: { bloom, strokes, grade }) */
    post(ctx, o = {}) {
      if (QUALITY.low || CONFIG.motion.paint === 0) return;
      const k = CONFIG.motion.paint == null ? 1 : CONFIG.motion.paint;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
      // bloom: o quadro reduzido, "elevado ao cubo" (só o que é claro sobrevive), somado de volta borrado
      sg.globalCompositeOperation = 'copy'; sg.drawImage(ctx.canvas, 0, 0, 240, 135);
      sg.globalCompositeOperation = 'multiply'; sg.drawImage(SM, 0, 0); sg.drawImage(SM, 0, 0);
      ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = (o.bloom == null ? .55 : o.bloom) * k; ctx.imageSmoothingEnabled = true; ctx.drawImage(SM, 0, 0, W, H);
      // gradação: luz quente no alto à esquerda, sombra fria embaixo à direita
      ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = (o.grade == null ? .38 : o.grade) * k;
      const g = ctx.createLinearGradient(0, 0, W * .7, H * 1.1); g.addColorStop(0, '#FFB878'); g.addColorStop(.5, '#808080'); g.addColorStop(1, '#25415E');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // pinceladas (v7.12: desligadas por padrão — CONFIG.motion.strokes > 0 liga de novo)
      const sk = o.strokes == null ? (CONFIG.motion.strokes || 0) : o.strokes;
      if (sk > 0) { if (!pat) pat = ctx.createPattern(STROKES, 'repeat'); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = sk * k; ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H); }
      ctx.restore();
    }
  };
})();

/** atmosfera: fachos de luz volumétrica e poeira flutuando (o: { light: 'warm'|'cool', shafts, dust, alpha, from }) */
function atmos(ctx, t, o = {}) {
  const A = o.alpha == null ? 1 : o.alpha; if (A <= 0) return;
  const warm = o.light !== 'cool', col = warm ? '#FFC98A' : '#9FD0FF', fx = o.from == null ? 260 : o.from;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  // fachos: trapézios do alto à esquerda, respirando devagar
  const n = o.shafts == null ? 3 : o.shafts;
  for (let k = 0; k < n; k++) {
    const x0 = fx + k * 230, w0 = 60 + k * 30, ang = .55 + k * .08, len = 1500, br = .5 + .5 * Math.sin(t * .35 + k * 1.7);
    const x1 = x0 + Math.tan(ang) * len, w1 = w0 * 4.5;
    const g = ctx.createLinearGradient(x0, 0, x1, len); g.addColorStop(0, rgba(col, (.16 + .06 * br) * A)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x0 - w0 / 2, -10); ctx.lineTo(x0 + w0 / 2, -10); ctx.lineTo(x1 + w1 / 2, len); ctx.lineTo(x1 - w1 / 2, len); ctx.closePath(); ctx.fill();
  }
  // poeira: partículas iluminadas subindo devagar (mais brilhantes dentro dos fachos)
  const d = o.dust == null ? 46 : o.dust;
  for (let k = 0; k < d; k++) {
    const sx = hash(k * 3.7), sy = hash(k * 9.1), sp = .006 + hash(k * 1.3) * .012, z = .4 + hash(k * 5.5) * .9;
    const x = ((sx * W + Math.sin(t * .3 + k) * 40 + t * 8 * z) % (W + 40) + W + 40) % (W + 40) - 20, y = ((sy - t * sp) % 1 + 1) % 1 * H;
    const tw = .5 + .5 * Math.sin(t * (1 + hash(k) * 2) + k * 2.1);
    ctx.fillStyle = rgba(col, (.25 + .45 * tw) * A); ctx.beginPath(); ctx.arc(x, y, 1.2 + 2.2 * z, 0, TAU); ctx.fill();
  }

  for (let k = 0; k < (o.bokeh == null ? 5 : o.bokeh); k++) {
    const x = hash(k * 11.3) * W + Math.sin(t * .2 + k) * 30, y = hash(k * 4.9) * H * .8, r = 40 + hash(k * 2.2) * 70, a = (.05 + .05 * Math.sin(t * .5 + k)) * A;
    const g = ctx.createRadialGradient(x, y, r * .2, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(.85, rgba(col, a * .7)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

}

/* ---------- volume: luz principal do alto à esquerda, recorte laranja do lado oposto ---------- */
const LIGHT = { hi: '#FFF3DE', lo: '#140B07', rim: '#FF8A3D' };
/** esfera pintada */
function vball(ctx, x, y, r, col, o = {}) {
  const g = ctx.createRadialGradient(x - r * .38, y - r * .42, r * .08, x, y, r * 1.02);
  g.addColorStop(0, mix(col, LIGHT.hi, .5)); g.addColorStop(.5, col); g.addColorStop(1, mix(col, LIGHT.lo, .55));
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
  if (o.rim !== false) { ctx.save(); ctx.beginPath(); ctx.arc(x, y, r - Math.max(1.5, r * .05), .1, 1.5); ctx.strokeStyle = rgba(o.rimCol || LIGHT.rim, .75); ctx.lineWidth = Math.max(2, r * .1); ctx.lineCap = 'round'; ctx.stroke(); ctx.restore(); }
  if (o.ink !== false) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.strokeStyle = INK; ctx.lineWidth = o.lw || Math.max(2, r * .07); ctx.stroke(); }
}
/** membro cilíndrico: traço grosso com sombra, realce do lado da luz e contorno */
function vlimb(ctx, x1, y1, x2, y2, w, col, o = {}) {
  ctx.save(); ctx.lineCap = 'round';
  if (o.ink !== false) { ctx.strokeStyle = INK; ctx.lineWidth = w + (o.lw || 5); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.strokeStyle = mix(col, LIGHT.lo, .3); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L, ny = (x2 - x1) / L, s = (nx + ny < 0 ? 1 : -1) * w * .2;
  ctx.strokeStyle = mix(col, LIGHT.hi, .22); ctx.lineWidth = w * .5; ctx.beginPath(); ctx.moveTo(x1 + nx * s, y1 + ny * s); ctx.lineTo(x2 + nx * s, y2 + ny * s); ctx.stroke();
  ctx.restore();
}
/** bloco 2.5D: face da frente + topo e lateral em perspectiva (d = profundidade) */
function vslab(ctx, x, y, w, h, d, col, o = {}) {
  const dx = d * .7, dy = -d * .5;
  ctx.save(); ctx.lineJoin = 'round';
  const face = (pts, c) => { ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = o.lw || 3; ctx.stroke(); };
  face([[x, y], [x + dx, y + dy], [x + w + dx, y + dy], [x + w, y]], mix(col, LIGHT.hi, .3));
  face([[x + w, y], [x + w + dx, y + dy], [x + w + dx, y + h + dy], [x + w, y + h]], mix(col, LIGHT.lo, .35));
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, mix(col, LIGHT.hi, .12)); g.addColorStop(1, mix(col, LIGHT.lo, .15));
  face([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], g);
  ctx.restore();
}
/** cone de luz de uma lâmpada (aditivo) */
function lightCone(ctx, x, y, w0, w1, len, col, a) {
  if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(x, y, x, y + len); g.addColorStop(0, rgba(col, .45 * a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - w0 / 2, y); ctx.lineTo(x + w0 / 2, y); ctx.lineTo(x + w1 / 2, y + len); ctx.lineTo(x - w1 / 2, y + len); ctx.closePath(); ctx.fill();
  ctx.restore();

/* ===== 13-people.js ===== */
/* ============================================================================
   13. PERSONAGENS — estilo desenho animado: cabeça grande, corpo baixinho, contorno
   grosso, olhos grandes e sombra chapada. Rig simples (quadril, tronco, cabeça, braços, pernas). Poses são números
   (ângulos), então dá para misturar uma pose na outra (mixPose).
   ----------------------------------------------------------------------------
   Coordenadas: origem nos pés, no chão; altura ~300 em escala 1; vista 3/4 olhando para +x.
   a: braços [perto, longe] = [ângulo do ombro a partir de "para baixo", dobra do cotovelo]
   l: pernas [perto, longe] = [ângulo do quadril, dobra do joelho]
   ========================================================================== */
const PEOPLE = (() => {
  // proporções de desenho animado: cabeça grande, corpo baixinho, braços e pernas finos, tênis grandes
  const L = { thigh: 46, shin: 46, torso: 82, ua: 40, fa: 36, R: 62 };
  const dn = (x, y, a, l) => [x + Math.sin(a) * l, y + Math.cos(a) * l];
  const POSE = {
    stand: { hx: 0, hy: -102, lean: 0, tilt: 0, a: [[.22, .15], [.14, .15]], l: [[.02, 0], [-.02, 0]] },
    sit: { hx: 0, hy: -60, lean: .04, tilt: .06, a: [[1.28, .42], [1.18, .52]], l: [[1.57, 1.57], [1.52, 1.52]] }
  };
  const num = (a, b, k) => typeof a === 'number' ? lerp(a, b, k) : a.map((v, i) => num(v, b[i], k));
  /** mistura duas poses (k = 0 → p, 1 → q) */
  function mixPose(p, q, k) { const o = {}; for (const key in p) o[key] = num(p[key], q[key], clamp(k)); return o; }
  function typing(t) { const p = JSON.parse(JSON.stringify(POSE.sit)); p.a[0][1] += .2 * Math.sin(t * 19); p.a[1][1] += .2 * Math.sin(t * 17 + 1.3); p.tilt += .04 * Math.sin(t * 2.2); return p; }
  /** passinho rápido e curto (como o andar apressado dos desenhos): tronco firme, pernas miúdas, quique leve */
  function walk(ph) {
    const s = Math.sin(ph), c = Math.cos(ph);
    return { hx: 0, hy: -102 - 5 * Math.abs(s), lean: .06, tilt: .05 * Math.sin(ph * 2), a: [[.55 + .18 * s, 1.05], [.5 - .18 * s, 1.05]], l: [[.36 * s, Math.max(0, c) * .95], [-.36 * s, Math.max(0, -c) * .95]] };
  }
  /** dança no tempo da música: desce no tempo, troca de lado a cada batida, braços para o alto */
  function dance(t, beat, bi) {
    const sw = bi % 2 ? 1 : -1, b = Math.pow(clamp(beat), 1.6), w = Math.sin(t * 6.5);
    return { hx: sw * 9, hy: -102 + 12 * b, lean: .1 * sw, tilt: -.2 * sw, a: [[2.7 + .3 * w, .45 + .3 * b], [2.55 - .3 * w, .55]], l: [[.25 * sw, .3 + .5 * b], [-.2 * sw, .3 + .35 * b]] };
  }
  function reach(k) { const p = JSON.parse(JSON.stringify(POSE.stand)); p.a[0] = [lerp(.22, 1.75, k), lerp(.15, 0, k)]; p.lean = .06 * k; return p; }
  /** segura algo na frente do peito (o bilhete); k = 0 braço solto → 1 segurando */
  function hold(k, base) { const p = JSON.parse(JSON.stringify(base || POSE.stand)); p.a[0] = [lerp(p.a[0][0], .5, k), lerp(p.a[0][1], 1.75, k)]; return p; }
  /** acena com o braço da frente */
  function wave(t, k = 1, base) { const p = JSON.parse(JSON.stringify(base || POSE.stand)); p.a[0] = [lerp(p.a[0][0], 2.75, k), lerp(p.a[0][1], .45 + .38 * Math.sin(t * 9), k)]; p.tilt += .05 * k; return p; }
  /** aponta para a frente e para cima */
  function point(k, base) { const p = JSON.parse(JSON.stringify(base || POSE.stand)); p.a[0] = [lerp(p.a[0][0], 2.05, k), lerp(p.a[0][1], -.05, k)]; p.lean += .03 * k; return p; }
  /** posição da mão (i = 0 braço da frente · 1 de trás) no mesmo espaço de draw(x, y, s, P, { dir }) */
  function hand(x, y, s, P, o = {}, i = 0) {
    const dir = o.dir || 1, side = i === 0 ? 1 : -1, N = [P.hx + Math.sin(P.lean) * L.torso, P.hy - Math.cos(P.lean) * L.torso];
    const sh = [N[0] + side * 30, N[1] + 14], [a, k] = P.a[i], el = dn(sh[0], sh[1], a, L.ua), hd = dn(el[0], el[1], a + k, L.fa);
    return [x + hd[0] * s * dir, y + hd[1] * s];
  }

  const COL = { skin: '#F7CBA6', skinDk: '#E3A27C', hair: '#F7D45C', hairDk: '#D8A433', top: '#E2462C', topDk: '#B8321E', stripe: C.yellow, pants: '#2E3A66', pantsDk: '#222B4E', shoe: '#FFFFFF', sole: C.orange, phones: C.orange };
  /** desenha a personagem (vista 3/4, olhando para +x). o: { dir, t, phones: 'neck'|'on', mood: 'tired'|'happy'|'calm', dark, swing, sil } */
  function draw(ctx, x, y, s, P, o = {}) {
    const dir = o.dir || 1, dark = o.dark || 0, t = o.t || 0, sil = !!o.sil, R = L.R;
    const tint = c => sil ? (o.silCol || '#120D0B') : (dark > 0 ? mix(c, '#0D1024', dark * .62) : c), OUT = sil ? tint('#000') : INK;
    const seg = (x1, y1, x2, y2, w, c) => { ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = OUT; ctx.lineWidth = w + 7; ctx.stroke(); ctx.strokeStyle = tint(c); ctx.lineWidth = w; ctx.stroke(); };
    const blob = (pathFn, c, lw = 4) => { pathFn(); ctx.fillStyle = tint(c); ctx.fill(); if (lw > 0) { ctx.strokeStyle = OUT; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); } };
    ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
    ctx.save(); ctx.globalAlpha *= .3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(P.hx * .5, 3, 70, 11, 0, 0, TAU); ctx.fill(); ctx.restore();
    const H0 = [P.hx, P.hy], N = [P.hx + Math.sin(P.lean) * L.torso, P.hy - Math.cos(P.lean) * L.torso];
    const leg = (i, side) => { const hip = [H0[0] + side * 13, H0[1] - 4], [a, k] = P.l[i], kn = dn(hip[0], hip[1], a, L.thigh), ft = dn(kn[0], kn[1], a - k, L.shin);
      seg(hip[0], hip[1], kn[0], kn[1], 19, side > 0 ? COL.pants : COL.pantsDk); seg(kn[0], kn[1], ft[0], ft[1], 16, side > 0 ? COL.pants : COL.pantsDk);
      ctx.save(); ctx.translate(ft[0], ft[1]); ctx.rotate(-(a - k) * .25);
      blob(() => { ctx.beginPath(); ctx.ellipse(12, 2, 27, 15, 0, 0, TAU); }, COL.shoe); if (!sil) { ctx.beginPath(); ctx.ellipse(12, 10, 26, 6, 0, 0, Math.PI); ctx.fillStyle = tint(COL.sole); ctx.fill(); line(ctx, 2, -6, 14, -8, rgba(INK, .5), 2.5); }
      ctx.restore(); };
    const arm = (i, side) => { const sh = [N[0] + side * 30, N[1] + 14], [a, k] = P.a[i], el = dn(sh[0], sh[1], a, L.ua), hd = dn(el[0], el[1], a + k, L.fa);
      seg(sh[0], sh[1], el[0], el[1], 15, side > 0 ? COL.top : COL.topDk); seg(el[0], el[1], hd[0], hd[1], 11, side > 0 ? COL.skin : COL.skinDk);
      blob(() => { ctx.beginPath(); ctx.arc(hd[0], hd[1], 11, 0, TAU); }, side > 0 ? COL.skin : COL.skinDk, 3.5); };
    leg(1, -1); arm(1, -1);
    // tronco: blusa vermelha com gola branca e faixa amarela, sombra chapada do lado de trás
    const px = Math.cos(P.lean), py = Math.sin(P.lean), sx = (k, w) => [lerp(N[0], H0[0], k) + w * px, lerp(N[1], H0[1], k) + w * py];

    P2.sort((u, v) => v[0][2] - u[0][2]);
    for (const [q, p] of P2) { const [x, y, , f] = q; if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue; const r = (1 + 2.4 * p.s) * f * f * (o.size || 1), al = A * depthA(f);
      if (f > 1.35 && !QUALITY.low) glow(ctx, x, y, r * 7, p.c, al * .5); ctx.fillStyle = rgba(p.c, al); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

})();

/* ---------- o mapa com os 3 capítulos (fim do embarque e Conversa 0) ---------- */
const MAPVIEW = { x: W / 2, y: H / 2 - 30, s: .93 };   // o mapa um pouco menor e mais baixo: o topo fica livre para o texto
const CHAP_POS = [[700, 424], [1200, 492], [1330, 812]];   // v7.14: o capítulo 2 sobe para o espaço livre entre as fileiras
function chapterTags(ctx, aFn) {
  TX.chapters.forEach(([name, ks, col], i) => {
    const a = aFn(i); if (a <= 0) return; const [x, y] = CHAP_POS[i], s = E.outBack(clamp(a)), w = measure(ctx, name, 34, 900) + 76;
    ctx.save(); ctx.translate(x, y); ctx.rotate([-.02, .015, -.012][i]); ctx.scale(s, s);
    paper(ctx, -w / 2, -38, w, 76, { r: 12, fill: col, shadow: 8, shadowColor: '#000', lw: 3.5 });
    tape(ctx, -w / 2 + 30, -38, 70, 24, -.3, 40 + i);
    late(ctx, c => { c.globalAlpha *= clamp(a * 1.6);
      text(c, `CAPÍTULO ${i + 1}  ·  ${ks.length > 1 ? 'ESTAÇÕES' : 'ESTAÇÃO'} ${ks.map(k => TX.stations[k - 1].n).join(', ')}`, 0, -60, { size: 19, weight: 800, mono: true, color: '#FFF', align: 'center', ls: 2 });
      text(c, name, 0, 2, { size: 34, weight: 900, color: i === 2 ? INK : '#FFF', align: 'center' }); });

}
function mapWorld(ctx, view, fn) { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(view.s, view.s); ctx.translate(-view.x, -view.y); fn(); ctx.restore(); }

/* ---------- embarque (20 s, trilha sintetizada a 120 BPM: compasso = 2 s) ---------- */
(() => {
  const id = 'open';
  const T_ARR = 1.3, T_STOP = 5.0, T_DOOR = 6.0;
  const T_TIX = 6.3, T_PUNCH = 7.6, T_DIVE = 13.0, T_MAP = 13.9;
  const L = 1500, S = 1.18, TY0 = 930 - 408 * S, DOOR = L * .5;
  const BOARD = 'PERFORMANCE ANALYTICS';
  cue(id, .3, 'type', { n: 22, gap: .03 }); cue(id, T_ARR, 'whoosh', { dur: 3.4, v: .35 });
  cue(id, T_DOOR, 'impact', { size: .8 }); cue(id, T_DOOR + .05, 'chime', { f: 987.8, up: -4 }); cue(id, T_TIX, 'pop', { p: 1, v: .2 });
  cue(id, T_PUNCH, 'click', { v: 1 }); cue(id, T_PUNCH + .1, 'shimmer', { dur: 1.6 }); cue(id, T_DIVE, 'whoosh', { dur: 1.2, v: .4 });
  [0, 1, 2].forEach(i => cue(id, T_MAP + 1.6 + i * .35, 'pop', { p: 1 + i * .1, v: .2 }));

  const SCRIPT = SAY.reg(id, [
    [.8, 6.6, 'big', TX.mission.replace('dados', '*dados*').replace('decisões', '*decisões*'), { y: 432, size: 52, band: true, visual: true }],
    [6.3, 13.6, 'title', 'Dos *dados* ao *valor*'],
    [6.4, 13.6, 'body', 'Combinamos conhecimento de *negócio*, *analytics* e *implementação* para orientar decisões.', { y: 250, visual: true }],
    [14.6, 20.3, 'title', 'O percurso'],
    [14.7, 20.3, 'note', 'Uma viagem pelas capacidades da nossa área, em *três capítulos*.', { x: 480, y: 128, w: 1340, align: 'left', size: 34, weight: 800 }]
  ]);

  function platformShot(ctx, t) {
    const dive = E.inCubic(P(t, T_DIVE, .9)), wake = 1 - E.outCubic(P(t, 0, 1.4)), push = 1 + .05 * E.inOutSine(P(t, T_DOOR, T_DIVE - T_DOOR));
    ctx.save();
    if (dive > 0) { const z = 1 + dive * 5; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -(TY0 + 170 * S)); ctx.translate(0, (TY0 + 170 * S - H / 2) * (1 - dive)); }
    else { ctx.translate(W / 2, TY0 + 170 * S); ctx.scale(push, push); ctx.translate(-W / 2, -(TY0 + 170 * S)); }
    platform(ctx, t, {});   // sem placa: o painel de partidas e o título ocupam o topo
    const ba = 1 - P(t, T_DOOR, .4); if (ba > 0) { ctx.save(); ctx.globalAlpha *= ba; FLAP.board(ctx, W / 2, 232 - 60 * P(t, T_DOOR, .4), [BOARD], [.3], t, { tw: 50, th: 74, hiFrom: [0], header: 'PARTIDA', headerCol: C.red, glowA: P(t, 1.6, .6) }); ctx.restore(); }
    // o trem bala chega da esquerda (nariz na frente) e freia com a porta no centro
    const arr = E.outCubic(P(t, T_ARR, T_STOP - T_ARR)), x = lerp(-(L + NOSE_LEN) * S - 80, W / 2 - DOOR * S, arr);
    if (t > T_ARR) {
      trainCar(ctx, x - (1000 + 40) * S, TY0, S, { len: 1000, doors: [300, 700], seed: 12, lit: 1, nose: 'left' });
      trainCar(ctx, x, TY0, S, { len: L, doors: [L * .17, DOOR, L * .83], logoX: 520, open: E.inOutCubic(P(t, T_DOOR, .7)), seed: 11, lit: 1, nose: 'right' });
      if (t > T_DOOR) glow(ctx, W / 2, TY0 + 200 * S, 300, '#FFE2B0', .4 * P(t, T_DOOR, .6));
    }
    ctx.restore();
    // o bilhete em close: DE dados → PARA valor, carimbado no embarque (como na v5.4)
    const tp = E.outBack(P(t, T_TIX, .5)) * (1 - P(t, T_DIVE - .2, .4));
    if (tp > 0) { glow(ctx, W / 2 + 40, 650, 520, '#FFD9A8', .22 * tp); ticket(ctx, W / 2 + 40, 650 + (1 - tp) * 320, 1.12 * tp, { punch: P(t, T_PUNCH, .3), rot: -.04 + .01 * Math.sin(t * .8) }); }
    if (wake > 0) { ctx.save(); ctx.globalAlpha = .85 * wake; ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    if (dive > .55) flash(ctx, (dive - .55) / .45 * .9, '#FFD9A0');
  }
  function mapShot(ctx, t) {
    const a = P(t, T_MAP, .7); if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    bgDark(ctx, t, { centerA: .9, center: '#33200F' }); glow(ctx, 960, 590, 900, C.orange, .14);
    const z = lerp(1.6, 1, E.outCubic(P(t, T_MAP, 1.4)));
    mapWorld(ctx, { ...MAPVIEW, s: MAPVIEW.s * z }, () => {
      metroMap(ctx, t, { reveal: E.inOutCubic(P(t, T_MAP, 1.5)), train: 0 });
      chapterTags(ctx, i => P(t, T_MAP + 1.6 + i * .35, .4));
    });
    ctx.restore();
  }
  SCENES[id] = {
    themeAt: () => 'dark', hideMap: true,
    peaks: [[T_DOOR - .1, T_DOOR + 1.2], [T_PUNCH - .1, T_PUNCH + .6, .5]],
    musicSync: T_DOOR,   // v7.18: com a música das conversas, o 1º drop dela cai aqui (as portas do trem abrem)
    script: SCRIPT,
    draw(ctx, t) {
      if (t < T_MAP + .8) platformShot(ctx, t);
      mapShot(ctx, t);
      scanlines(ctx, .04);

    }
  };
})();

/* ---------- Conversa 0: a missão e o mapa, interativos (clique numa estação → detalhe; → embarca) ---------- */
STOPSCN.stop0 = (() => {
  const KEYS = [1, 2, 3, 'p1', 4, 5, 6, 'p2', 7];
  const view = k => { if (k == null) return MAPVIEW; const n = MAP.node(k); return { x: lerp(W / 2, n.x, .8), y: lerp(H / 2, n.y, .8), s: 1.45 }; };

  function detail(ctx, k, a, tl, cam) {
    if (a <= 0 || k == null) return;
    const n = MAP.node(k), isStop = typeof k === 'string', st = isStop ? null : TX.stations[k - 1];
    const title = isStop ? TX.stopInfo[k][0] : st.title, sub = isStop ? TX.stopInfo[k][1] : st.teaser, see = isStop ? [] : st.see || [];
    const w = 860, h = 240 + see.length * 60, [sx] = toScreen(cam, n.x, n.y), x = sx < W / 2 ? W - w - 70 : 70, y = H / 2 - h / 2 + 30;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x + w / 2, y + h / 2 + (1 - E.outBack(a)) * 40); ctx.rotate(-.006);
    paper(ctx, -w / 2, -h / 2, w, h, { torn: true, seed: 70, fill: '#F6EEDF', shadow: 14, shadowColor: '#000', lw: 4, tape: [[.5, 0, .05]] });
    rr(ctx, -w / 2 + 24, -h / 2 + 26, w - 48, 100, 10); ctx.fillStyle = isStop ? C.yellow : k <= 3 ? C.red : k <= 6 ? C.orange : C.yellow; ctx.fill(); inkRect(ctx, -w / 2 + 24, -h / 2 + 26, w - 48, 100, 10, 3, 5);
    const light = isStop || k === 7;
    if (!isStop) retroText(ctx, st.n, -w / 2 + 64, -h / 2 + 76, { size: 48, weight: 900, color: '#FFF', depth: 3, lw: 3 });
    const ttl = measure(ctx, title, 32, 900) > w - 200 ? twoLines(title) : title;
    text(ctx, ttl, isStop ? 0 : -w / 2 + 134, -h / 2 + 76, { size: 32, weight: 900, color: light ? INK : '#FFF', align: isStop ? 'center' : 'left', lh: 1.08 });
    para(ctx, sub, -w / 2 + 40, -h / 2 + 146, w - 80, { size: 28, weight: 700, color: '#4A4038' });
    see.forEach((l, i) => { const yy = -h / 2 + 236 + i * 60; circle(ctx, -w / 2 + 52, yy, 9, C.orange, INK, 2.5); text(ctx, l, -w / 2 + 76, yy + 1, { size: Math.min(28, 28 * (w - 120) / measure(ctx, l, 28, 800)), weight: 800, color: INK }); });
    ctx.restore();
  }
  return {
    draw(ctx, tl, item, prevItem, p, ui) {
      ui = ui || { sel: null, prevSel: null, selP: 1, hover: null };
      const cam = camOf(ui);
      // fundo: a estação continua viva atrás do mapa (luz piscando, ratinho, trem passando…)
      platform(ctx, tl, { led: true, people: true });
      ctx.save(); ctx.fillStyle = 'rgba(12,9,7,.68)'; ctx.fillRect(0, 0, W, H); ctx.restore();
      mapWorld(ctx, cam, () => {
        glow(ctx, 960, 590, 900, C.orange, .12 + .05 * BT.breath);
        metroMap(ctx, tl, { reveal: 1, hi: ui.sel != null ? ui.sel : ui.hover, train: 0 });
        const dim = 1 - (ui.sel != null ? E.outCubic(ui.selP) * .7 : (1 - E.outCubic(ui.selP)) * .7 * (ui.prevSel != null ? 1 : 0));
        ctx.save(); ctx.globalAlpha *= dim; chapterTags(ctx, () => 1); ctx.restore();
      });
      scanlines(ctx, .04);
    },
    ui(ctx, tl, item, prevItem, p, ui) {
      ui = ui || { sel: null, prevSel: null, selP: 1, hover: null };
      const cam = camOf(ui), out = ui.sel == null ? 1 - E.outCubic(ui.selP) : 0, inn = ui.sel != null ? E.outCubic(ui.selP) : 0;
      // a missão escrita, sempre visível
      const ma = ui.sel == null ? E.inOutCubic(ui.selP) : 1 - E.inOutCubic(ui.selP);
      if (ma > 0) { ctx.save(); ctx.globalAlpha *= ma; ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 16;
        text(ctx, 'NOSSA MISSÃO', W / 2, 62, { size: 20, weight: 800, mono: true, color: C.yellow, align: 'center', ls: 5 });

/* ============================================================================
   9. PLAYER — modo apresentação
   ----------------------------------------------------------------------------
   • Plays: trechos de vídeo lineares (render puro em função de T).
   • Paradas: loop infinito enquanto as apresentadoras falam; → / PageDown /
     espaço / clique avançam os itens (cartazes) e, no último, embarcam no
     próximo trecho. ← / PageUp voltam. Durante o vídeo, as setas não pulam nada.

    w.textContent = 'Falta o arquivo sources.js na mesma pasta deste HTML: o vídeo roda, mas sem as músicas. (clique para fechar)';
    w.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#B3261E;color:#fff;font:600 15px/1.3 system-ui,sans-serif;padding:10px 16px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.4);cursor:pointer;max-width:90vw;text-align:center';
    w.onclick = () => w.remove(); document.body.appendChild(w); console.warn('[fontes] sources.js não carregou: sem músicas'); }
  const DUR = CONFIG.duration, SHOW = CONFIG.mode !== 'reel', STOPS = CONFIG.stops, ITEM_DUR = 1.1;
  const st = { T: 0, playing: false, startPerf: 0, startT: 0, ended: false,
    mode: SHOW ? 'stop' : 'play', stop: 0, item: 0, prevItem: 0, itemAt: performance.now(), stopAt: performance.now(), next: null };

  const UI = { sel: null, prevSel: null, selAt: 0, selP: 1, pop: null, prevPop: null, popAt: 0, popP: 1, hover: null };
  const resetUI = () => Object.assign(UI, { sel: null, prevSel: null, selAt: 0, selP: 1, pop: null, prevPop: null, popAt: 0, popP: 1, hover: null });
  const CTL = {
    select(v) { if (v === UI.sel) return; UI.prevSel = UI.sel; UI.sel = v; UI.selAt = performance.now(); poke(); },
    popup(v) { if (v === UI.pop) return; UI.prevPop = UI.pop; UI.pop = v; UI.popAt = performance.now(); poke(); },

  const NAME = s => s.station ? `${TX.stations[s.station - 1].n} · ${TX.stations[s.station - 1].short}` : ({ open: 'Abertura', close: 'Letreiro final' })[s.id] || s.id;
  const STOP_NAME = { preshow: 'Pré-show', stop0: 'Parada 0 · roteiro', stop1: 'Parada 1 · retomada', stop2: 'Parada 2 · retomada', end: 'Encerramento' };

  // ---------- render ----------
  function drawScene(s, t, T) {
    const impl = SCENES[s.id];
    if (!impl) { bgDark(ctx, t); text(ctx, NAME(s), W / 2, H / 2, { size: 64, align: 'center', color: C.stone }); return; }
    impl.draw(ctx, t, T);
  }
  function themeOf(s, t) { const impl = SCENES[s.id]; return impl && impl.themeAt ? impl.themeAt(t) : s.theme; }
  /** desenha o quadro do trecho no instante T, sem sobreposições (as paradas usam para emendar) */
  function frameAt(c, T) { const s = sceneAt(T), keep = [BT, NOW]; BT = BEAT.at(T); NOW = T; HUD.begin(c); try { (SCENES[s.id] || { draw: () => bgDark(c, 0) }).draw(c, T - s.start, T); } finally { HUD.flush(c); } [BT, NOW] = keep; }

  function renderStop(id, tl, item, prevItem, p) {

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const impl = STOPSCN[id], now = performance.now();

    rr(ctx, W / 2 - w / 2, H - 70 - h, w, h, 18); ctx.fillStyle = 'rgba(10,10,10,.72)'; ctx.fill();
    lines.forEach((l, i) => text(ctx, l, W / 2, H - 70 - h + 15 + lh / 2 + i * lh, { size: 34, weight: 600, color: '#FFF', align: 'center' })); ctx.restore();

    if (cur) out.push(cur); return out;
  }

  // ---------- transporte ----------
  const nextStop = T => SHOW ? STOPS.find(s => s.T > T + 1e-3) || null : null;
  function now() { return st.playing ? st.startT + (performance.now() - st.startPerf) / 1000 : st.T; }
  function play() {
    if (st.T >= DUR - .05) st.T = 0;
    st.mode = 'play'; st.playing = true; st.ended = false; st.startT = st.T; st.startPerf = performance.now(); st.next = nextStop(st.T);
    if (CONFIG.audio.music || CONFIG.audio.sfx) AUDIO.start(st.T); else AUDIO.init();
    // v7.17–v7.18: na abertura (play com pause) a música das conversas é a trilha, no mesmo relógio das faixas do filme (o drop cai
    // nas portas do trem); nos outros plays ela sai em fade enquanto o vídeo volta
    const pl = CONFIG.playById[sceneAt(st.T).play];
    if (pl && pl.pause && PAUSE.buf) PAUSE.playFrom(st.T - pl.start, AUDIO.playing ? AUDIO.ctxTime(st.T) : 0); else PAUSE.stop();
    VOICE.reset(st.T); intro.classList.add('hidden'); syncUI(); poke();
  }

  function snapshot(T) { return SNAP.cv && Math.abs(SNAP.T - T) < .3 ? SNAP.cv : null; }

    if (st.mode === 'play') { SNAP.cv = SNAP.cv || makeCanvas(W, H, () => {}); const g = SNAP.cv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.drawImage(cv, 0, 0); SNAP.T = STOPS[i].T; }

  $('bVoice').onclick = () => { CONFIG.audio.voice = !CONFIG.audio.voice; if (!CONFIG.audio.voice) VOICE.pause(); syncUI(); };
  $('bCC').onclick = () => { CONFIG.captions = !CONFIG.captions; syncUI(); };
  $('bFull').onclick = () => { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen()); };
  intro.onclick = () => play();
  // clique e ponteiro nas paradas: a cena da parada decide o alvo (hit) e a ação (click); sem alvo, o clique segue viagem
  const stagePt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  const stopImpl = () => st.mode === 'stop' ? STOPSCN[STOPS[st.stop].id] : null;
  cv.addEventListener('click', e => {
    if (st.mode !== 'stop') return; const impl = stopImpl();
    if (impl && impl.hit) { const [x, y] = stagePt(e), tg = impl.hit(x, y, UI); if (impl.click(tg, UI, CTL)) return; }
    next();
  });
  cv.addEventListener('pointermove', e => {
    const impl = stopImpl(); if (!impl || !impl.hit) { if (UI.hover != null) UI.hover = null; cv.style.cursor = ''; return; }
    const [x, y] = stagePt(e), h = UI.hover = impl.hit(x, y, UI);
    cv.style.cursor = h == null || h.back || h.pop === 'inside' ? '' : 'pointer';
  });
  window.addEventListener('keydown', e => {
    const k = e.key, impl = stopImpl();
    if (impl && impl.key && impl.key(k, UI, CTL)) { e.preventDefault(); return; }
    if (k === 'ArrowRight' || k === 'PageDown' || k === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (st.mode === 'stop') next(); else if (e.code === 'Space' || k === 'Enter') { if (!intro.classList.contains('hidden')) play(); else toggle(); }
    }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'p' || k === 'P') { if (st.mode === 'play') toggle(); }
    else if (/^[1-7]$/.test(k)) jumpStation(+k);
    else if (k === 'Home' || k === 'r' || k === 'R') gotoStop(0);
    else if (k === 'End') gotoStop(STOPS.length - 1);
    else if (k === 'f' || k === 'F') $('bFull').onclick();
    else if (k === 'm' || k === 'M') $('bSound').onclick();
    else if (k === 'v' || k === 'V') $('bVoice').onclick();
    else if (k === 'c' || k === 'C') $('bCC').onclick();
    else if (k === 'q' || k === 'Q') { QUALITY.forced = QUALITY.forced == null ? !QUALITY.low : QUALITY.forced ? false : null; $('voiceinfo').textContent = QUALITY.forced == null ? 'Qualidade: automática' : QUALITY.forced ? 'Qualidade: leve' : 'Qualidade: máxima'; }
  });
  let idleT = 0; function poke() { ui.classList.remove('idle'); document.body.style.cursor = ''; clearTimeout(idleT);
    idleT = setTimeout(() => { if (st.playing || st.mode === 'stop') { ui.classList.add('idle'); document.body.style.cursor = 'none'; } }, 2600); }
  window.addEventListener('pointermove', poke);
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; }
  window.addEventListener('resize', fit); fit();

  VOICE.init(v => { $('voiceinfo').textContent = v ? `Voz: ${v.name}` : (VOICE.supported ? 'Voz: padrão do sistema' : 'Voz indisponível'); });
  if (SHOW) intro.classList.add('hidden'); else { st.T = 40; renderPlay(st.T); st.T = 0; }
  syncUI(); poke(); requestAnimationFrame(() => { requestAnimationFrame(loop); });

  // ganchos para testes e exportação
  window.__render = T => renderPlay(T);
  window.__renderStop = (id, tl, item = 0, prevItem = item, p = 1, ui) => { const keep = { ...UI }; if (ui) Object.assign(UI, { selAt: -1e9, popAt: -1e9 }, ui); renderStop(id, tl, item, prevItem, p); Object.assign(UI, keep); };
  window.__ui = UI; window.__ctl = CTL;
  window.__seek = seek; window.__state = st; window.__next = next; window.__prev = prev; window.__gotoStop = gotoStop; window.__jump = jumpStation;
  return { play, pause, seek, frameAt, slideAt, snapshot, next, prev };
})();
</script>
