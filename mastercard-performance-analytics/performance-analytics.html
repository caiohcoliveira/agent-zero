<title>Performance Analytics — A Interseção</title>
<!--
  ============================================================================
  PERFORMANCE ANALYTICS — "A INTERSEÇÃO"
  Vídeo animado executivo (~4:00) · 1920×1080 · arquivo único, 100% offline.

  Arquitetura (um único <script>, organizado em seções):
    1. CONFIG ........ parâmetros editáveis (cores, tempos, textos, narração, áudio, motion)
    2. CORE .......... easing, interpolação, RNG com seed, cores, primitivas de desenho, câmera
    3. COMPONENTS .... ícones, agentes, cards, carimbos, chips de capítulo, dashboard
    4. VIZ ........... visualizações de modelos (gaussiana, regressão, árvore, clusters…)
    5. AUDIO ......... trilha + SFX sintetizados em Web Audio (sincronizados à timeline)
    6. VOICE ......... narração via Web Speech API (pt-BR, voz feminina quando disponível)
    7. SCENES ........ 10 cenas; cada uma é uma função pura draw(ctx, t) → seek perfeito
    8. PLAYER ........ loop requestAnimationFrame, transições, controles, teclado

  Atalhos: Espaço = play/pause · R = reiniciar · ←/→ = ±5s · F = tela cheia
           M = som · V = voz · C = legendas
  ============================================================================
-->
<style>

  }
  #ui button:hover { background: rgba(255,255,255,.18); }

/* Linha do tempo derivada (não editar) */
(function buildTimeline() {
  let t = 0;
  CONFIG.scenes.forEach((s, i) => { s.index = i; s.start = t; s.end = t + s.dur; t += s.dur; });
  CONFIG.duration = t;
  CONFIG.sceneById = Object.fromEntries(CONFIG.scenes.map(s => [s.id, s]));
  CONFIG.narration.forEach(n => { n.t = CONFIG.sceneById[n.scene].start + n.at; });
  CONFIG.narration.sort((a, b) => a.t - b.t);
})();
/** pergunta/capítulo pelo id do caso */
const Q = id => CONFIG.text.questions.find(q => q.id === id);

/* ===== 02-core.js ===== */
/* ============================================================================
   2. CORE — matemática, easing, cores, primitivas de desenho, câmera, fundos
   ========================================================================== */
const C = CONFIG.colors, F = CONFIG.fonts, M = CONFIG.motion;
const TAU = Math.PI * 2;

// ---------- matemática ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
/** progresso 0..1 de `t` dentro de [start, start+dur], com easing opcional */
const P = (t, start, dur, ease) => { const p = clamp((t - start) / dur); return ease ? ease(p) : p; };
/** janela: sobe em [a, a+fi], fica 1, desce em [b-fo, b] */
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(P(t, a, fi, E.outCubic), 1 - P(t, b - fo, fo, E.inCubic));
const twos = t => (M.onTwos ? Math.floor(t * CONFIG.fps / 2) / (CONFIG.fps / 2) : t);

const E = {
  linear: x => x,
  inQuad: x => x * x, outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x, outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outQuart: x => 1 - Math.pow(1 - x, 4),

  const pad = mini ? 8 : 24, top = y + hh + pad;

/* ============================================================================
   5. AUDIO — trilha + SFX 100% sintetizados (Web Audio API)
   ----------------------------------------------------------------------------
   • A trilha é uma função do tempo do vídeo: um scheduler com lookahead
     agenda notas em semicolcheias (16ths) → seek/pause sempre em sincronia.
   • Seções (MUSIC) definem quais instrumentos tocam e o filtro do mix.
   • SFX são cues da timeline: cue('cena', tLocal, 'tipo', {opções}).
   ========================================================================== */
const CUES = [];
function cue(sceneId, at, type, opt = {}) {
  const t = CONFIG.sceneById[sceneId].start + at;
  CUES.push({ t, type, opt });
  if (type === 'impact') IMPACTS.push({ t, size: opt.size == null ? 1 : opt.size });
}

// Arranjo da trilha POR CENA (tempo local, múltiplos de 0.125 s). f = corte do filtro passa-baixa (Hz).
// Flags: kick hat hat16 clap bass arp pad pluck comic roll big soft minor arpOct rise (filtro sobe até o fim da seção)
const FULL = { kick: 1, hat: 1, clap: 1, bass: 1, arp: 1, pad: 1 };
const MUSIC_SPEC = {
  hook:      [[0, { pad: 1, f: 700 }], [4, { pad: 1, kick: 1, soft: 1, f: 1200, rise: 1 }], [6.5, { ...FULL, f: 14000 }], [17, { pad: 1, f: 1200 }]],
  problem:   [[0, { kick: 1, hat: 1, bass: 1, pad: 1, f: 950 }], [14, { pad: 1, f: 800 }]],
  hub:       [[0, { pad: 1, f: 800 }], [4, { ...FULL, f: 15000 }]],
  als:       [[0, { ...FULL, hat16: 1, f: 5200, minor: 1 }]],
  embed:     [[0, { pad: 1, arp: 1, soft: 1, f: 2600 }], [9, { kick: 1, hat: 1, bass: 1, arp: 1, pad: 1, f: 9000 }]],
  lightsoff: [[0, { kick: 1, pluck: 1, comic: 1, f: 3200 }], [12, { f: 400 }], [14, { ...FULL, f: 15000 }], [22, { kick: 1, pad: 1, bass: 1, f: 2000, rise: 1 }]],
  insights:  [[0, { ...FULL, f: 7000, arpOct: 1 }], [18.5, { pad: 1, arp: 1, soft: 1, kick: 1, f: 3200 }], [26.5, { ...FULL, hat16: 1, f: 15000 }]],
  skills:    [[0, { kick: 1, hat: 1, bass: 1, arp: 1, pad: 1, f: 3000, rise: 1 }], [12.5, { ...FULL, hat16: 1, f: 12000 }], [18, { kick: 1, hat16: 1, roll: 1, bass: 1, pad: 1, f: 9000 }]],
  climax:    [[0, { ...FULL, hat16: 1, big: 1, f: 16000 }]],
  close:     [[0, { pad: 1, arp: 1, soft: 1, f: 4200 }], [7, { kick: 1, hat: 1, bass: 1, arp: 1, pad: 1, f: 9000 }], [16.5, { f: 3000 }]]
};
const MUSIC = (() => {
  const out = [];
  CONFIG.scenes.forEach(sc => { const spec = MUSIC_SPEC[sc.id] || [[0, { pad: 1, f: 3000 }]];
    spec.forEach(([at, f], i) => out.push([sc.start + at, sc.start + (i + 1 < spec.length ? spec[i + 1][0] : sc.dur), f])); });
  out.push([CONFIG.duration, CONFIG.duration + 1, { f: 3000 }]);

const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];       // Am F C G (vi–IV–I–V)

const AUDIO = {
  ctx: null, ready: false, master: null, music: null, sfx: null, filter: null, verb: null, noiseBuf: null,
  playing: false, t0v: 0, t0c: 0, nextStep: 0, cueIdx: 0, timer: null, duck: 1,

/* ===== 06-voice.js ===== */
/* ============================================================================
   6. VOICE — narração com Web Speech API (speechSynthesis)
   ----------------------------------------------------------------------------
   • Cada frase dispara no seu cue (CONFIG.narration) → sincronia por frase.
   • Prefere voz feminina pt-BR; aplica grafia fonética aos termos em inglês.
   • Para trocar por locução gravada: desligue a voz (CONFIG.audio.voice=false)
     e use os mesmos tempos de CONFIG.narration como guia de edição.
   ========================================================================== */
const VOICE = {
  supported: 'speechSynthesis' in window, voice: null, idx: 0, active: 0, bad: new Set(), current: null,

  init(onPick) {
    if (!this.supported) { onPick && onPick(null); return; }
    const pick = () => { this.voice = this.choose(); onPick && onPick(this.voice); };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  choose() {
    const vs = speechSynthesis.getVoices().filter(v => !this.bad.has(v.name)); if (!vs.length) return null;
    const A = CONFIG.audio, score = v => {
      let s = 0; const lang = (v.lang || '').toLowerCase().replace('_', '-'), nm = v.name;
      if (lang === 'pt-br') s += 100; else if (lang.startsWith('pt')) s += 40; else return -1;
      const pi = A.preferredVoices.findIndex(p => nm.includes(p)); if (pi >= 0) s += 50 - pi;
      if (A.avoidVoices.some(p => nm.includes(p))) s -= 80;
      if (/natural|neural|online/i.test(nm)) s += 12;
      return s;
    };
    return vs.map(v => [score(v), v]).filter(a => a[0] > 0).sort((a, b) => b[0] - a[0]).map(a => a[1])[0] || null;
  },
  spoken(str) { let s = str; CONFIG.phonetics.forEach(([re, rep]) => { s = s.replace(re, rep); }); return s; },

  /** reposiciona após seek/pause */
  reset(T) {
    if (this.supported) speechSynthesis.cancel();
    this.active = 0; AUDIO.setDuck && AUDIO.ready && AUDIO.setDuck(false);
    this.idx = CONFIG.narration.findIndex(n => n.t >= T - .05); if (this.idx < 0) this.idx = CONFIG.narration.length;
  },
  update(T, playing) {
    const N = CONFIG.narration;
    while (this.idx < N.length && N[this.idx].t <= T) {
      const n = N[this.idx++];
      if (playing && CONFIG.audio.voice && this.supported && T - n.t < .8) this.speak(n);
    }
  },
  speak(n) {
    const u = new SpeechSynthesisUtterance(this.spoken(n.text));
    u.lang = 'pt-BR'; if (this.voice) u.voice = this.voice;
    u.rate = CONFIG.audio.voiceRate * (n.rate || 1); u.pitch = CONFIG.audio.voicePitch; u.volume = 1;
    u.onstart = () => { this.active++; AUDIO.ready && AUDIO.setDuck(true); };
    const end = () => { this.active = Math.max(0, this.active - 1); if (!this.active && AUDIO.ready) AUDIO.setDuck(false); };
    u.onend = end;
    u.onerror = (e) => { end(); if (this.voice && e.error && e.error !== 'interrupted' && e.error !== 'canceled') { this.bad.add(this.voice.name); this.voice = this.choose(); } };
    speechSynthesis.speak(u);
  },
  pause() { if (this.supported) speechSynthesis.cancel(); this.active = 0; },

  /** legenda atual (texto da frase em curso) */
  caption(T) {
    const N = CONFIG.narration; let cur = null;
    for (let i = 0; i < N.length; i++) { if (N[i].t <= T) cur = N[i]; else break; }
    if (!cur) return null; const next = N[N.indexOf(cur) + 1];
    const end = Math.min(next ? next.t : Infinity, cur.t + Math.max(1.6, cur.text.length * .068));
    return T < end ? cur.text : null;
  }
};

/* ===== 10-scenes-a.js ===== */
/* ============================================================================
   7. SCENES — cada cena: SCENES[id].draw(ctx, t, T)  (t = tempo local, T = global)
   ========================================================================== */
const SCENES = {};
const TX = CONFIG.text;

/** linha com destaque: "Mais *dados*." → "dados" na cor accent */
function rich(ctx, str, x, y, o = {}) {
  const size = o.size || 120, weight = o.weight || 800, ls = o.ls == null ? -size * .025 : o.ls;
  const parts = str.split(/(\*[^*]+\*)/).filter(Boolean).map(p => ({ s: p.replace(/\*/g, ''), hi: p[0] === '*' }));
  const ws = parts.map(p => measure(ctx, p.s, size, weight, false, ls)), total = ws.reduce((a, b) => a + b, 0);
  let cx = o.align === 'left' ? x : o.align === 'right' ? x - total : x - total / 2;
  parts.forEach((p, i) => { text(ctx, p.s, cx, y, { size, weight, ls, color: p.hi ? (o.accent || C.orange) : (o.color || C.white), alpha: o.alpha }); cx += ws[i]; });
  return total;
}
/** pílula simples (rótulos, keywords) */
function pill(ctx, x, y, label, o = {}) {
  const size = o.size || 22, w = measure(ctx, label, size, o.weight || 700) + size * 1.6, h = size * 1.9;
  ctx.save(); ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha); ctx.translate(x, y); ctx.scale(o.scale || 1, o.scale || 1);
  ctx.rotate(o.rot || 0);
  if (o.fill && !o.flat) { ctx.save(); ctx.translate(3, 4); rr(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = rgba(INK, .85); ctx.fill(); ctx.restore(); }
  rr(ctx, -w / 2, -h / 2, w, h, h / 2); if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  const st = o.stroke || (o.fill && !o.flat ? INK : null); if (st) { ctx.strokeStyle = st; ctx.lineWidth = o.lw || 2.5; ctx.stroke(); }
  text(ctx, label, 0, 1, { size, weight: o.weight || 700, color: o.color || C.ink, align: 'center' }); ctx.restore(); return w;
}
/** íris (abre/fecha) — r = raio do buraco */
function iris(ctx, cx, cy, r, color = '#000') {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(cx, cy, Math.max(0, r), 0, TAU, true); ctx.fillStyle = color; ctx.fill('evenodd'); ctx.restore();
}

/* ---------------------------------------------------------------------------
   CENA 1 — HOOK: os 5 desafios de hoje (0:00–0:18)
   Ponto laranja → tempestade de recortes de dados → 5 tiras de papel coladas
   uma a uma → pôster de colagem com "Gerar valor" → o papel claro sobe
   --------------------------------------------------------------------------- */
(() => {
  const id = 'hook', SL = [6.5, 8.0, 9.5, 11.0, 13.9], T_KICK = 3.5, T_POSTER = 14.5, T_OUT = 16.6;
  [0, .85, 1.7].forEach(t => cue(id, t, 'heart'));
  cue(id, 1.0, 'riser', { dur: 1.0, v: .2 }); cue(id, 2.0, 'impact', { size: .55 }); cue(id, 2.0, 'whoosh', { dur: .8, v: .5 });
  cue(id, T_KICK, 'pop', { p: 1.2 }); cue(id, 4.2, 'riser', { dur: 2.3, v: .3 });
  SL.forEach((t, i) => { cue(id, t, 'impact', { size: i === 4 ? 1.5 : .75 + i * .1 }); cue(id, t - .22, 'whoosh', { dur: .22, v: .3 }); cue(id, t + .02, 'tick', { f: 900, v: .3 }); });
  cue(id, 13.95, 'combo'); cue(id, T_POSTER, 'whoosh', { dur: .5, v: .25 }); cue(id, T_OUT, 'whoosh', { dur: .8, dir: 'down', v: .5 }); cue(id, 17.2, 'swell', { dur: .8 });

  const r = rng(101), TYPES = ['card', 'kpi', 'spark', 'pill', 'bars', 'dot', 'dot', 'dot', 'ring'];
  const PILLS = ['Nova transação', 'Alerta de risco', 'Pix recebido', 'Meta atingida', 'Novo cliente', 'Pico de volume'];
  const KPIS = ['+12,4%', '98,7%', 'R$ 2,4 mi', '−3,1%', '1,2 mi', '+0,8 p.p.'];
  const COLS = [C.red, C.orange, C.yellow, PAPER];
  const ITEMS = Array.from({ length: 96 }, (_, i) => ({
    type: TYPES[i % TYPES.length], x: (r() * 2 - 1) * 1.15, y: (r() * 2 - 1) * .85, z0: r() * 3, rot: (r() - .5) * .5,
    col: COLS[i % 4], label: PILLS[i % PILLS.length], kpi: KPIS[i % KPIS.length], seed: i
  }));
  const dist = t => { const a = (1.2 - .32) / 6; let d = .32 * Math.max(0, t - 2); if (t > 8) d += .5 * a * Math.min(t - 8, 6) ** 2; return d; };

        rr(ctx, -66, -18, 34, 26, 5); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill(); circle(ctx, 50, 32, 16, C.red, INK, 3); circle(ctx, 70, 32, 16, C.yellow, INK, 3); break;
      case 'kpi': paper(ctx, -100, -48, 200, 96, { r: 6, fill: PAPER, shadow: 7, shadowColor: '#000', lw: 4 });
        text(ctx, it.kpi, -80, 8, { size: 40, weight: 900, color: INK }); text(ctx, 'KPI', -80, -26, { size: 14, weight: 700, color: C.stone, mono: true }); break;
      case 'spark': { rr(ctx, -110, -50, 220, 100, 10); ctx.fillStyle = '#231E19'; ctx.fill(); ctx.strokeStyle = PAPER; ctx.lineWidth = 3; ctx.stroke();
        ctx.strokeStyle = it.col; ctx.lineWidth = 6; ctx.beginPath(); for (let k = 0; k < 9; k++) ctx.lineTo(-90 + k * 22, 20 - Math.sin(k * 1.3 + it.seed) * 22 - k * 3); ctx.stroke(); break; }
      case 'pill': { const w = measure(ctx, it.label, 24, 700) + 70; paper(ctx, -w / 2, -26, w, 52, { r: 26, fill: PAPER, shadow: 5, shadowColor: '#000', lw: 3 });
        circle(ctx, -w / 2 + 28, 0, 9, it.col, INK, 2); text(ctx, it.label, -w / 2 + 48, 1, { size: 24, weight: 800, color: INK }); break; }
      case 'bars': [40, 70, 50, 90, 60].forEach((h, k) => { rr(ctx, -60 + k * 26, 40 - h, 18, h, 3); ctx.fillStyle = k === 3 ? it.col : PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke(); }); break;

      list.push({ it, z, sx: W / 2 + it.x * spread * 820 / z, sy: H / 2 + it.y * spread * 520 / z, a: clamp((3.1 - z) * 1.2) * clamp((z - .14) * 6) * born, s: .55 / z }); }

        text(ctx, 'PRÓXIMA PARADA', 0, 1, { size: 20, weight: 800, mono: true, color: '#FFF', align: 'center', ls: 4 }); ctx.restore();
        circle(ctx, bx + bw - 30, by - th / 2 - 46, 9, Math.sin(t * 6) > 0 ? C.yellow : '#4A3A20');
        const gA = t > T_F[3] + 1 ? E.outCubic(P(t, T_F[3] + 1, .8)) : 0;
        for (let i = 0; i < LEN; i++) { const st = flapState(i, t), k = Math.max(0, st.k); tile(ctx, bx + i * (tw + gap), by - th / 2, tw, th, st, i >= HI[k] && st.cur !== ' ', gA); }
        if (gA > 0) { ctx.save(); ctx.globalAlpha *= gA; rr(ctx, bx - 34, by - th / 2 - 74, bw + 68, th + 118, 18); ctx.strokeStyle = C.orange; ctx.lineWidth = 4; ctx.shadowColor = C.orange; ctx.shadowBlur = 24; ctx.stroke(); ctx.restore(); }
      }
      ctx.restore();
      scanlines(ctx, .07);
      // bookend: o ponto laranja pulsando (mesmo da abertura)
      if (end > 0) { const pulse = [T_END + .3, T_END + 1.0].reduce((a, s) => a + Math.exp(-Math.max(0, t - s) * 6) * (t >= s), 0);
        glow(ctx, W / 2, H / 2, 120 + pulse * 80, C.orange, .7 * end); circle(ctx, W / 2, H / 2, (16 + pulse * 8) * end, C.orange); }
    }
  };
})();

/* ===== 90-player.js ===== */
/* ============================================================================
   8. PLAYER — render, transições, loop, controles
   ========================================================================== */
const PLAYER = (() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage'), intro = document.getElementById('intro'), ui = document.getElementById('ui');
  const $ = id => document.getElementById(id);
  const bar = $('bar'), fill = bar.querySelector('.fill'), knob = bar.querySelector('.knob'), tip = bar.querySelector('.tip');
  const st = { T: 0, playing: false, startPerf: 0, startT: 0, ended: false };
  const DUR = CONFIG.duration;
  const NAMES = { hook: 'Abertura', problem: 'O problema', hub: 'Performance Analytics', insights: 'Caso 01 · Insights em escala', als: 'Caso 02 · Recomendação (ALS)',
    embed: 'Caso 03 · Embeddings', lightsoff: 'Caso 04 · Lights-off', skills: 'Possibilidades', climax: 'Clímax', close: 'Fechamento' };

  function sceneAt(T) { const S = CONFIG.scenes; for (let i = S.length - 1; i >= 0; i--) if (T >= S[i].start) return S[i]; return S[0]; }
  function drawScene(s, t, T) {
    const impl = SCENES[s.id];
    if (!impl) { bgDark(ctx, t); text(ctx, s.id, W / 2, H / 2, { size: 60, align: 'center', color: C.stone }); return; }
    impl.draw(ctx, t, T);
  }
  function themeOf(s, t) { const impl = SCENES[s.id]; return impl && impl.themeAt ? impl.themeAt(t) : s.theme; }

  function render(T) {
    T = clamp(T, 0, DUR - 1e-3);
    const s = sceneAt(T), t = T - s.start, sh = shakeAt(T);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.translate(sh.x, sh.y); ctx.translate(W / 2, H / 2); ctx.rotate(sh.r); ctx.translate(-W / 2, -H / 2);
    const tr = s.transitionIn;
    if (tr && t < tr.dur && s.index > 0) {
      const prev = CONFIG.scenes[s.index - 1]; drawScene(prev, prev.dur - 1e-3, s.start - 1e-3);
      const p = E.inOutCubic(t / tr.dur); ctx.save(); ctx.beginPath(); ctx.arc(W / 2, H / 2, lerp(0, 1180, p), 0, TAU); ctx.clip(); drawScene(s, t, T); ctx.restore();
      ctx.beginPath(); ctx.arc(W / 2, H / 2, lerp(0, 1180, p), 0, TAU); ctx.strokeStyle = rgba(C.orange, 1 - p); ctx.lineWidth = 10; ctx.stroke();
    } else drawScene(s, t, T);
    ctx.restore();
    chips(ctx, T, themeOf(s, t));
    if (CONFIG.captions) { const cap = VOICE.caption(T); if (cap) {
      ctx.save(); ctx.font = font(34, 600); const lines = wrap(cap, 1400), lh = 46, h = lines.length * lh + 30, w = Math.min(1500, Math.max(...lines.map(l => ctx.measureText(l).width)) + 60);
      rr(ctx, W / 2 - w / 2, H - 70 - h, w, h, 18); ctx.fillStyle = 'rgba(10,10,10,.72)'; ctx.fill();
      lines.forEach((l, i) => text(ctx, l, W / 2, H - 70 - h + 15 + lh / 2 + i * lh, { size: 34, weight: 600, color: '#FFF', align: 'center' })); ctx.restore(); } }
    grain(ctx, T);
  }
  function wrap(str, maxW) {
    const words = str.split(' '), out = []; let cur = '';
    words.forEach(w => { const tst = cur ? cur + ' ' + w : w; if (ctx.measureText(tst).width > maxW && cur) { out.push(cur); cur = w; } else cur = tst; });
    if (cur) out.push(cur); return out;
  }

  // ---------- transporte ----------
  function now() { return st.playing ? st.startT + (performance.now() - st.startPerf) / 1000 : st.T; }
  function play() {
    if (st.T >= DUR - .05) st.T = 0;
    st.playing = true; st.ended = false; st.startT = st.T; st.startPerf = performance.now();
    if (CONFIG.audio.music || CONFIG.audio.sfx) AUDIO.start(st.T); else AUDIO.init();
    VOICE.reset(st.T); intro.classList.add('hidden'); syncUI(); poke();
  }
  function pause() { st.T = now(); st.playing = false; AUDIO.stop(); VOICE.pause(); syncUI(); poke(); }
  function seek(T) { const was = st.playing; if (was) pause(); st.T = clamp(T, 0, DUR); if (was) play(); else { VOICE.reset(st.T); render(st.T); syncUI(); } }
  function toggle() { st.playing ? pause() : play(); }

  function loop() {
    if (st.playing) { st.T = now(); if (st.T >= DUR) { st.T = DUR; pause(); st.ended = true; } VOICE.update(st.T, st.playing); }
    render(st.T); syncProgress(); requestAnimationFrame(loop);
  }

  // ---------- UI ----------
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function syncProgress() { const p = st.T / DUR * 100; fill.style.width = p + '%'; knob.style.left = p + '%'; $('time').textContent = `${fmt(st.T)} / ${fmt(DUR)}`; }
  function syncUI() {
    $('bPlay').textContent = st.playing ? '❚❚' : (st.ended ? '↻' : '▶');
    $('bSound').classList.toggle('off', !(CONFIG.audio.music || CONFIG.audio.sfx));
    $('bVoice').classList.toggle('off', !CONFIG.audio.voice); $('bCC').classList.toggle('off', !CONFIG.captions);
  }
  CONFIG.scenes.forEach(s => { if (!s.start) return; const k = document.createElement('div'); k.className = 'tick'; k.style.left = (s.start / DUR * 100) + '%'; bar.appendChild(k); });
  const tAt = e => { const r = bar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DUR; };
  let drag = false;
  bar.addEventListener('pointerdown', e => { drag = true; bar.setPointerCapture(e.pointerId); seek(tAt(e)); });
  bar.addEventListener('pointermove', e => { const T = tAt(e); tip.textContent = `${fmt(T)} · ${NAMES[sceneAt(T).id]}`; tip.style.left = (T / DUR * 100) + '%'; if (drag) { st.T = T; if (!st.playing) render(T); } });
  bar.addEventListener('pointerup', e => { if (drag) { drag = false; seek(tAt(e)); } });
  $('bPlay').onclick = toggle; $('bRestart').onclick = () => { seek(0); if (!st.playing) play(); };
  $('bSound').onclick = () => { const on = !(CONFIG.audio.music || CONFIG.audio.sfx); CONFIG.audio.music = CONFIG.audio.sfx = on; AUDIO.applyToggles(); if (on && st.playing && !AUDIO.playing) AUDIO.start(st.T); syncUI(); };
  $('bVoice').onclick = () => { CONFIG.audio.voice = !CONFIG.audio.voice; if (!CONFIG.audio.voice) VOICE.pause(); syncUI(); };
  $('bCC').onclick = () => { CONFIG.captions = !CONFIG.captions; syncUI(); };
  $('bFull').onclick = () => { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen()); };
  intro.onclick = () => play();
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); intro.classList.contains('hidden') ? toggle() : play(); }
    else if (e.key === 'r' || e.key === 'R') { seek(0); if (!st.playing) play(); }
    else if (e.key === 'ArrowRight') seek(now() + 5); else if (e.key === 'ArrowLeft') seek(now() - 5);
    else if (e.key === 'f' || e.key === 'F') $('bFull').onclick();
    else if (e.key === 'm' || e.key === 'M') $('bSound').onclick();
    else if (e.key === 'v' || e.key === 'V') $('bVoice').onclick();
    else if (e.key === 'c' || e.key === 'C') $('bCC').onclick();
  });
  let idleT = 0; function poke() { ui.classList.remove('idle'); document.body.style.cursor = ''; clearTimeout(idleT);
    idleT = setTimeout(() => { if (st.playing) { ui.classList.add('idle'); document.body.style.cursor = 'none'; } }, 2600); }
  window.addEventListener('pointermove', poke);
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; }
  window.addEventListener('resize', fit); fit();

  VOICE.init(v => { $('voiceinfo').textContent = v ? `Voz: ${v.name}` : (VOICE.supported ? 'Voz: padrão do sistema' : 'Voz indisponível'); });
  st.T = 39.5; render(st.T); st.T = 0; // pôster atrás do overlay inicial
  syncUI(); requestAnimationFrame(() => { requestAnimationFrame(loop); });

  // ganchos para testes/exportação
  window.__render = T => render(T); window.__seek = seek; window.__state = st;
  return { play, pause, seek, render };
})();
</script>
